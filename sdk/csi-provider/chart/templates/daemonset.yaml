# One provider per node, beside the driver: it answers the driver on a unix socket and reaches
# roll's API. It needs no Kubernetes permissions: the driver passes each pod's own token.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ .Release.Name }}-roll-secrets-csi-provider
  namespace: {{ .Release.Namespace }}
  labels: { app.kubernetes.io/name: roll-secrets-csi-provider, app.kubernetes.io/instance: {{ .Release.Name }} }
spec:
  selector:
    matchLabels: { app.kubernetes.io/name: roll-secrets-csi-provider, app.kubernetes.io/instance: {{ .Release.Name }} }
  updateStrategy: { type: RollingUpdate }
  template:
    metadata:
      labels: { app.kubernetes.io/name: roll-secrets-csi-provider, app.kubernetes.io/instance: {{ .Release.Name }} }
    spec:
      automountServiceAccountToken: false
      securityContext: { seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: provider
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["-endpoint=/provider/roll.sock"]
          # The driver's socket directory is root's: the provider writes its socket there.
          securityContext: { runAsUser: 0, allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
          resources: {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - { name: providers, mountPath: /provider }
      volumes:
        - name: providers
          hostPath: { path: {{ .Values.providersDir | quote }}, type: DirectoryOrCreate }
      {{- with .Values.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity: {{- toYaml . | nindent 8 }}
      {{- end }}
