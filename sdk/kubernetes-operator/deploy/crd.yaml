# RollSecret: a project's environment kept in a Secret beside it by the roll secrets operator.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: rollsecrets.roll.sh
spec:
  group: roll.sh
  scope: Namespaced
  names:
    kind: RollSecret
    plural: rollsecrets
    singular: rollsecret
  versions:
    - name: v1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - { name: Environment, type: string, jsonPath: .spec.environment }
        - { name: Keys, type: integer, jsonPath: .status.keys }
        - { name: Synced, type: string, jsonPath: .status.syncedAt }
        - { name: Error, type: string, jsonPath: .status.error }
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              required: [environment]
              properties:
                project: { type: string, description: "The project (prj_…); the identity's own when left out." }
                environment: { type: string, description: "The environment, e.g. production." }
                path: { type: string, description: "The folder (default /)." }
                secretName: { type: string, description: "The Secret to keep in step, in this namespace (default: this RollSecret's name)." }
                identity: { type: string, description: "The workload identity to log in as (default: the operator's ROLL_IDENTITY)." }
                serviceAccountName: { type: string, description: "A service account of this namespace to log in as (the identity's subject is system:serviceaccount:<namespace>:<name>). Required outside the operator's own namespaces." }
                rolloutRestart:
                  type: array
                  description: "Deployments, StatefulSets and DaemonSets of this namespace restarted when the Secret changes; each opts in with the annotation roll.sh/restart-on naming this RollSecret."
                  items:
                    type: object
                    required: [kind, name]
                    properties:
                      kind: { type: string, enum: [Deployment, StatefulSet, DaemonSet] }
                      name: { type: string }
            status:
              type: object
              properties:
                digest: { type: string }
                syncedAt: { type: string }
                keys: { type: integer }
                error: { type: string }
                observedGeneration: { type: integer }
                pendingRestarts: { type: string }
                restartError: { type: string }
