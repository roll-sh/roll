# Reference RabbitMQ for `scripts/test-queues-clients.sh --rabbitmq`: the matrix must pass against
# real RabbitMQ too, which proves the client programs test RabbitMQ semantics. roll presents
# RabbitMQ 4.1, where transient non-exclusive queues and global QoS (Celery uses it for ETA
# tasks) are still permitted; 4.3 denies them by default.
deprecated_features.permit.transient_nonexcl_queues = true
deprecated_features.permit.global_qos = true
loopback_users = none
