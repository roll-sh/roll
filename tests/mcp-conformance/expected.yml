# Checks of the official MCP conformance suite (scripts/test-mcp-conformance.sh) known not to
# pass against roll, and why. Each line is `<scenario>:<check-id>`, so a scenario's other checks
# still hold. A listed check passing fails the run (remove its line); one failing that isn't
# listed is a regression.
server:
  # calls a fixture of the suite's reference server (its test tools, prompts or resources, or a task or input request one of them makes), which roll doesn't have
