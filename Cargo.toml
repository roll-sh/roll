[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["vendor"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
anyhow = "1"
axum = "0.8"
bytes = "1"
clap = { version = "4", features = ["derive", "env"] }
getrandom = "0.4"
reqwest = { version = "0.13", default-features = false, features = ["json"] }
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-postgres = "0.7"
tower = { version = "0.5", features = ["util"] }
hyper = { version = "1", features = ["server", "client", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "tokio", "server", "server-auto"] }
tower-http = { version = "0.7", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

object_store = { version = "0.14", features = ["aws"] }
postgres-protocol = "0.6"
zstd = "0.14"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
lz4_flex = { version = "0.11", default-features = false, features = ["frame", "std"] }
snap = "1"
humantime = "2"
futures = "0.3"
async-trait = "0.1"
base64 = "0.22"
bcrypt = "0.19"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
chrono-tz = "0.10"
croner = "3"
hmac = "0.12"
sha2 = "0.10"
url = "2"
aws-config = { version = "1", features = ["behavior-version-latest"] }
aws-sdk-dynamodb = "1"
aws-sdk-s3 = "1"
aws-sdk-kms = "1"
aws-sdk-sesv2 = "1"
# Tests only: endpoints that make the SDK sign with SigV4a.
aws-smithy-types = "1"
# Tests only: an S3 client with a test CA and pinned addresses (crates/rolld/tests/fleet_e2e.rs).
aws-smithy-http-client = { version = "1", features = ["rustls-aws-lc"] }
aws-smithy-runtime-api = "1"
lambda_http = { version = "1", default-features = false, features = ["apigw_http", "apigw_rest", "alb"] }
tasks = { path = "crates/tasks" }
kafka-protocol = { version = "0.18", features = ["messages_enums"] }
# mimalloc v2: lower per-key RSS than v3 for the Redis engine (measured against Valkey 9.1).
mimalloc = { version = "0.1.52", default-features = false, features = ["v2"] }
libmimalloc-sys = { version = "0.1.49", default-features = false, features = ["extended", "v2"] }
crc32c = "0.6"
uuid = "1"
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
# QR codes of virtual MFA seeds (the module matrix only; roll writes the PNG).
qrcode = { version = "0.14", default-features = false }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging", "tls12"] }
rustls-pemfile = "2"
rdkafka = { version = "0.39", features = ["cmake-build", "ssl-vendored", "zstd"] }
rcgen = "0.14"
# roll secrets: certificate lifetimes (rcgen takes time's dates).
time = "0.3"
x509-parser = "0.18"
pg-control = { path = "crates/pg-control" }
pg-storage = { path = "crates/pg-storage" }
pg-proxy = { path = "crates/pg-proxy" }
# roll cloud's edge: TLS, SNI and Host routing, PROXY protocol, ACME.
roll-edge = { path = "crates/roll-edge" }
# ACME (DNS-01) for the edge's certificates; ring, like the rest of the workspace's rustls.
instant-acme = { version = "0.8", default-features = false, features = ["ring", "hyper-rustls", "rcgen"] }
stream-log = { path = "crates/stream-log" }
stream-broker = { path = "crates/stream-broker" }
crc32fast = "1"
hex = "0.4"
rustls-native-certs = "0.8"
tokio-postgres-rustls = "0.13"
lapin = "4"
parking_lot = "0.12"
regex = "1"
tokio-util = { version = "0.7", features = ["codec"] }
mq-core = { path = "crates/mq-core" }
mq-amqp = { path = "crates/mq-amqp" }
mq-storage = { path = "crates/mq-storage" }
mq-control = { path = "crates/mq-control" }
mq-cluster = { path = "crates/mq-cluster" }
mq-mqtt = { path = "crates/mq-mqtt" }
mq-stomp = { path = "crates/mq-stomp" }
mq-amqp10 = { path = "crates/mq-amqp10" }
mq-stream = { path = "crates/mq-stream" }
mq-mgmt = { path = "crates/mq-mgmt" }
mq-http = { path = "crates/mq-http" }
mq-shovel = { path = "crates/mq-shovel" }
futures-util = "0.3"
rumqttc = "0.25"
fe2o3-amqp = "0.18"
serde_amqp = "0.18"
rabbitmq-stream-client = "0.11"
tokio-tungstenite = "0.30"
percent-encoding = "2"
urlencoding = "2"
tempfile = "3"
libc = "0.2"
md-5 = "0.11"

# Serverless Redis.
# JSON documents (RedisJSON): the JSONPath grammar runs on the pest version RedisJSON pins, so
# syntax errors are reported identically.
pest = "=2.8.6"
pest_derive = "=2.8.6"
half = "2.7"
ryu = "1.0.23"
indexmap = "2"
itoa = "1"
memchr = "2"
smallvec = { version = "1", features = ["union", "const_generics", "write"] }
foldhash = "0.2"
rand = "0.8"
sha1 = "0.10"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
# ScyllaDB's WASM UDFs (nosql-engine `udf/wasm.rs`): WAT text and a fuel-metered interpreter.
wasmi = "2"
wat = "1"
libm = "0.2"
rustc_apfloat = "0.2"
cc = "1"
redis-lua = { path = "crates/redis-lua" }
snowball = { path = "crates/snowball" }
redis-proto = { path = "crates/redis-proto" }
redis-engine = { path = "crates/redis-engine" }
redis-server = { path = "crates/redis-server" }
redis-control = { path = "crates/redis-control" }

# roll code.
diffy = "0.5"
serde_yaml_ng = "0.10"
jsonwebtoken = { version = "11", default-features = false, features = ["use_pem", "rust_crypto"] }
code-sql = { path = "crates/code-sql" }
roll-cluster = { path = "crates/roll-cluster" }
roll-accounts = { path = "crates/roll-accounts" }
roll-auth = { path = "crates/roll-auth" }
roll-workspace = { path = "crates/roll-workspace" }
roll-previews = { path = "crates/roll-previews" }
apps-build = { path = "crates/apps-build" }
apps-control = { path = "crates/apps-control" }
roll-access = { path = "crates/roll-access" }
roll-mcp = { path = "crates/roll-mcp" }
roll-net = { path = "crates/roll-net" }
roll-secrets = { path = "crates/roll-secrets" }
code-store = { path = "crates/code-store" }
code-git = { path = "crates/code-git" }
code-github = { path = "crates/code-github" }
code-chat = { path = "crates/code-chat" }
code-control = { path = "crates/code-control" }
code-preview = { path = "crates/code-preview" }
# Isolated work: checks, previews and sandboxes as their own Fargate tasks (docs/cloud/README.md).
roll-fetch = { path = "crates/roll-fetch" }
aws-sdk-ecs = "1"
aws-sdk-cloudwatchlogs = "1"
# roll apps on the fleet: builds in CodeBuild, images in ECR, build variables in Secrets Manager.
aws-sdk-codebuild = "1"
aws-sdk-ecr = "1"
aws-sdk-secretsmanager = "1"
code-index = { path = "crates/code-index" }
code-review = { path = "crates/code-review" }
agent-proto = { path = "crates/agent-proto" }
agent-host = { path = "crates/agent-host" }
model-gateway = { path = "crates/model-gateway" }
aes-gcm = "0.10"
# Endpoint keys sealed to a daemon (agent-host `endpoints.rs`): X25519 and HKDF.
curve25519-dalek = "4"
hkdf = "0.12"
# GitHub Actions secrets are libsodium sealed boxes (code-github `seal_secret`).
crypto_box = { version = "0.9", features = ["seal"] }
blake2 = "0.10"
toml = "1"
http-body-util = "0.1"
ignore = "0.4"
http-body = "1"
comrak = { version = "0.56", default-features = false }
ammonia = "4"
# roll storage (S3-compatible object storage).
quick-xml = "0.41"
crc-fast = "1"
httpdate = "1"
ipnet = "2"
# SigV4a (ECDSA P-256), and the local backend's at-rest encryption for SSE-C.
p256 = { version = "0.13", default-features = false, features = ["ecdsa", "std"] }
# STS web identity: RS256/ES256 JWT signatures (verification only).
ring = "0.17"
# Tests only: RSA keys to sign web identity tokens with, and the STS client.
rsa = "0.9"
aws-sdk-sts = "1"
# Tests only: the S3 Control client (access points).
aws-sdk-s3control = "1"
zeroize = "1"
# IAM: login passwords (argon2id); X.509 certificates (server, signing, SAML metadata) and the
# structure of private keys (matching a key to its certificate; no private-key operations).
argon2 = { version = "0.5", default-features = false, features = ["alloc", "password-hash"] }
x509-cert = { version = "0.2", default-features = false, features = ["pem"] }
pkcs1 = { version = "0.7", default-features = false, features = ["std"] }
pkcs8 = { version = "0.10", default-features = false, features = ["std"] }
sec1 = { version = "0.7", default-features = false, features = ["der", "std"] }
s3-proto = { path = "crates/s3-proto" }
s3-store = { path = "crates/s3-store" }
s3-server = { path = "crates/s3-server" }
s3-control = { path = "crates/s3-control" }
s3-select = { path = "crates/s3-select" }
s3-api = { path = "crates/s3-api" }
# S3 Select: BZIP2 input (pure Rust, libbz2-rs-sys).
bzip2 = "0.6"
# roll code agents: ACP registry archives (agent-host/src/registry/archive.rs), unpacked in Rust.
tar = { version = "0.4", default-features = false }
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }
# Image transformations (s3-image): decoders (JPEG via zune-jpeg, PNG, GIF, WebP: pure Rust), SIMD
# resizing, a pure-Rust JPEG encoder, libwebp for lossy WebP (C, vendored and statically linked:
# there's no pure-Rust lossy WebP encoder under a usable licence), AVIF encoding via rav1e.
s3-image = { path = "crates/s3-image" }
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "gif", "webp"] }
fast_image_resize = { version = "6.1", default-features = false, features = ["std"] }
jpeg-encoder = { version = "0.7", features = ["simd"] }
libwebp-sys = { version = "0.14", default-features = false, features = ["std"] }
moxcms = { version = "0.8", default-features = false, features = ["avx_shaper_paths", "sse_shaper_paths", "neon_shaper_paths", "lut"] }
ravif = { version = "0.13", default-features = false }
imgref = "1.12"
rgb = "0.8"
# The gateway's hot-object cache: W-TinyLFU admission for its memory and disk tiers.
moka = { version = "0.12", default-features = false, features = ["sync"] }
# roll nosql (Cassandra / ScyllaDB compatible)
nosql-types = { path = "crates/nosql-types" }
nosql-lua = { path = "crates/nosql-lua" }
nosql-proto = { path = "crates/nosql-proto" }
nosql-cql = { path = "crates/nosql-cql" }
nosql-storage = { path = "crates/nosql-storage" }
nosql-engine = { path = "crates/nosql-engine" }
nosql-alternator = { path = "crates/nosql-alternator" }
nosql-server = { path = "crates/nosql-server" }
nosql-control = { path = "crates/nosql-control" }
nosql-sstable-import = { path = "crates/nosql-sstable-import" }
# CQL varint / decimal arithmetic.
num-bigint = "0.4"
num-traits = "0.2"
# The Rust ScyllaDB driver (nosql-server driver tests); rustls, no OpenSSL.
scylla = { version = "1.9", default-features = false, features = ["rustls-023"] }
# `roll nosql cqlsh`: line editing, history and completion; terminal display widths.
rustyline = { version = "19", default-features = false, features = ["with-file-history"] }
unicode-width = "0.2"
# roll search (Elasticsearch-compatible).
fst = "0.4"
memmap2 = "0.9"
hashbrown = "0.16"
unicode-segmentation = "1"
unicode-normalization = "0.1"
regex-syntax = "0.8"
search-analysis = { path = "crates/search-analysis" }
search-codec = { path = "crates/search-codec" }
search-index = { path = "crates/search-index" }
search-aggs = { path = "crates/search-aggs" }
search-painless = { path = "crates/search-painless" }
search-store = { path = "crates/search-store" }
search-es = { path = "crates/search-es" }
search-server = { path = "crates/search-server" }
search-control = { path = "crates/search-control" }
search-yaml = { path = "crates/search-yaml" }

# kafka-protocol 0.18.0 sizes decode buffers from peer-supplied counts; see vendor/kafka-protocol/ROLL.md.
[patch.crates-io]
kafka-protocol = { path = "vendor/kafka-protocol" }

# Tests generate RSA keys (web identity); unoptimised big-integer code makes that slow.
[profile.dev.package.num-bigint-dig]
opt-level = 3

# IAM login passwords are hashed with argon2id (19 MiB, 2 passes): unoptimised, a hash takes
# seconds.
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3

# Image codecs: unoptimised, an AVIF encode or a 12 MP decode takes many seconds in tests.
[profile.dev.package.rav1e]
opt-level = 3
[profile.dev.package.fast_image_resize]
opt-level = 3
[profile.dev.package.zune-jpeg]
opt-level = 3
[profile.dev.package.jpeg-encoder]
opt-level = 3
[profile.dev.package.image-webp]
opt-level = 3
[profile.dev.package.libwebp-sys]
opt-level = 3
[profile.dev.package.png]
opt-level = 3
[profile.dev.package.fdeflate]
opt-level = 3
[profile.dev.package.miniz_oxide]
opt-level = 3
[profile.dev.package.gif]
opt-level = 3
[profile.dev.package.weezl]
opt-level = 3
[profile.dev.package.moxcms]
opt-level = 3
[profile.dev.package.image]
opt-level = 3
[profile.dev.package.s3-image]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
