[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["vendor"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
anyhow = "1"
axum = "0.8"
bytes = "1"
clap = { version = "4", features = ["derive", "env"] }
getrandom = "0.4"
reqwest = { version = "0.13", default-features = false, features = ["json"] }
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-postgres = "0.7"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.7", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

object_store = { version = "0.14", features = ["aws"] }
postgres-protocol = "0.6"
zstd = "0.14"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
lz4_flex = { version = "0.11", default-features = false, features = ["frame", "std"] }
snap = "1"
humantime = "2"
futures = "0.3"
async-trait = "0.1"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
chrono-tz = "0.10"
croner = "3"
hmac = "0.12"
sha2 = "0.10"
url = "2"
aws-config = { version = "1", features = ["behavior-version-latest"] }
aws-sdk-dynamodb = "1"
aws-sdk-s3 = "1"
lambda_http = { version = "1", default-features = false, features = ["apigw_http", "apigw_rest", "alb"] }
tasks = { path = "crates/tasks" }
kafka-protocol = { version = "0.18", features = ["messages_enums"] }
mimalloc = { version = "0.1", default-features = false }
libmimalloc-sys = { version = "0.1", default-features = false, features = ["extended"] }
crc32c = "0.6"
uuid = "1"
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls-pemfile = "2"
rdkafka = { version = "0.39", features = ["cmake-build", "ssl-vendored", "zstd"] }
rcgen = "0.14"
pg-control = { path = "crates/pg-control" }
pg-storage = { path = "crates/pg-storage" }
pg-proxy = { path = "crates/pg-proxy" }
stream-log = { path = "crates/stream-log" }
stream-broker = { path = "crates/stream-broker" }
crc32fast = "1"
hex = "0.4"
rustls-native-certs = "0.8"
tokio-postgres-rustls = "0.13"
lapin = "4"
parking_lot = "0.12"
regex = "1"
tokio-util = { version = "0.7", features = ["codec"] }
mq-core = { path = "crates/mq-core" }
mq-amqp = { path = "crates/mq-amqp" }
mq-storage = { path = "crates/mq-storage" }
mq-control = { path = "crates/mq-control" }
mq-proxy = { path = "crates/mq-proxy" }
mq-cluster = { path = "crates/mq-cluster" }
mq-mqtt = { path = "crates/mq-mqtt" }
mq-stomp = { path = "crates/mq-stomp" }
mq-amqp10 = { path = "crates/mq-amqp10" }
mq-stream = { path = "crates/mq-stream" }
mq-mgmt = { path = "crates/mq-mgmt" }
mq-http = { path = "crates/mq-http" }
mq-shovel = { path = "crates/mq-shovel" }
futures-util = "0.3"
rumqttc = "0.25"
fe2o3-amqp = "0.18"
serde_amqp = "0.18"
rabbitmq-stream-client = "0.11"
tokio-tungstenite = "0.30"
percent-encoding = "2"
urlencoding = "2"
tempfile = "3"
libc = "0.2"
md-5 = "0.11"

# kafka-protocol 0.18.0 sizes decode buffers from peer-supplied counts; see vendor/kafka-protocol/ROLL.md.
[patch.crates-io]
kafka-protocol = { path = "vendor/kafka-protocol" }

[profile.release]
lto = "thin"
codegen-units = 1
