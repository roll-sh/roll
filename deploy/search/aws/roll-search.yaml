AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  roll search on AWS: Elasticsearch-compatible clusters that cost nothing while idle. A shared
  fleet of stateless Graviton search nodes (ECS on EC2 with an on-demand base plus Spot, or
  Fargate) owns clusters through leases in Postgres and keeps everything in S3 (optionally the WAL
  in S3 Express One Zone). A small search-proxy per AZ routes each request to its cluster's owner
  and starts nodes when none run. In front: a Lambda function URL, or with CertificateArn a
  Network Load Balancer with TLS. Its own VPC, no NAT gateway (S3 through gateway endpoints).

Metadata:
  # W1030: cfn-lint resolves MetadataUrlSecretArn to its empty default, which isn't an ARN; it
  # is only used with DatabaseMode external, where the ExternalDatabaseUrl rule requires it.
  cfn-lint: { config: { ignore_checks: [W1030] } }

Parameters:
  ImageUri:
    Type: String
    Description: >-
      roll-search image in ECR, built from deploy/search/Dockerfile for linux/arm64. With the
      Lambda front door it must be a single-architecture image (push with --provenance=false).
  VpcCidr:
    Type: String
    Default: 10.43.0.0/16
  CertificateArn:
    Type: String
    Default: ""
    Description: >-
      ACM certificate for Domain (and *.Domain with ClusterHostNames). Set it to serve clients
      from a Network Load Balancer with TLS (about $20/month, no per-request charge, no payload
      limit) instead of a Lambda function URL (about $0.40 per million requests plus duration,
      6 MB request and response limit).
  Domain:
    Type: String
    Default: ""
    Description: The endpoint's host name, with CertificateArn. Point it (and *.Domain with ClusterHostNames) at the LoadBalancer output.
  ClusterHostNames:
    Type: String
    AllowedValues: ["true", "false"]
    Default: "false"
    Description: >-
      With CertificateArn: give every cluster its own host name, <cluster>.<Domain> (needs a
      wildcard certificate and DNS record). Otherwise clusters share Domain and are told apart by
      their credentials.
  ClientCidr:
    Type: String
    Default: 0.0.0.0/0
    Description: Who may reach the load balancer (with CertificateArn).
  NodeCompute:
    Type: String
    AllowedValues: [ec2, fargate]
    Default: ec2
    Description: >-
      ec2: Graviton instances from an Auto Scaling group, OnDemandNodes of them on demand and the
      rest Spot (cheapest; a cold start from zero nodes includes an instance boot, about a minute).
      fargate: Fargate on demand for OnDemandNodes, Fargate Spot above (no instances, faster cold
      starts, higher price).
  MinNodes:
    Type: Number
    Default: 1
    MinValue: 0
    Description: >-
      Nodes always running. 0 lets the fleet stop after IdleMinutesToZero minutes without any
      request; the next request is held by the proxy while a node starts.
  MaxNodes:
    Type: Number
    Default: 8
    MinValue: 1
    MaxValue: 100
  OnDemandNodes:
    Type: Number
    Default: 1
    MinValue: 0
    Description: How many nodes always run on demand; everything above is Spot. Spot reclaims hand clusters over gracefully.
  NodeVcpus:
    Type: Number
    Default: 2
    Description: With ec2, vCPUs per node instance (any current Graviton type with this many qualifies).
  NodeInstanceMemoryMiB:
    Type: Number
    Default: 8192
    Description: With ec2, the least memory per node instance.
  NodeCpu:
    Type: Number
    Default: 2048
    AllowedValues: [1024, 2048, 4096, 8192, 16384]
    Description: CPU units per node task.
  NodeMemory:
    Type: Number
    Default: 6144
    Description: Memory per node task, in MiB (with ec2, leave about 10% of the instance for the ECS agent). Loaded clusters may use three quarters of it.
  NodeCacheGiB:
    Type: Number
    Default: 30
    # Fargate ephemeral storage takes 21-200 GiB. With ec2 this is a volume of its own, apart
    # from the instance's 30 GiB root volume (the OS, the ECS agent and Docker).
    MinValue: 21
    MaxValue: 200
    Description: >-
      Local disk per node for the segment cache, the write-ahead log and segments being written
      (a cache only; everything is in S3). A tenth of it, at least 2 GiB, stays free.
  CpuTarget:
    Type: Number
    Default: 60
    MinValue: 10
    MaxValue: 90
    Description: Average node CPU (percent) the fleet scales out to keep.
  IdleClusterSeconds:
    Type: Number
    Default: 300
    MinValue: 1
    Description: Unload a cluster after this many seconds without requests (a cluster's own idle timeout wins); it wakes on the next request.
  IdleMinutesToZero:
    Type: Number
    Default: 15
    MinValue: 1
    MaxValue: 1440
    Description: With MinNodes 0, stop the last node after this many minutes without any request.
  ProxyCount:
    Type: Number
    Default: 3
    MinValue: 1
    Description: search-proxy tasks (Fargate arm64, a quarter vCPU each); ECS spreads them over the three AZs.
  ExpressZoneId:
    Type: String
    Default: ""
    AllowedPattern: "^([a-z0-9]+-az[0-9]+)?$"
    Description: >-
      An AZ id (e.g. use1-az4) to keep the WAL in an S3 Express One Zone directory bucket there:
      write acknowledgements in single-digit milliseconds instead of S3 Standard's tens. WAL
      batches not yet flushed into segments live in that one AZ. Segments and manifests stay in
      S3 Standard.
  NodeTls:
    Type: String
    AllowedValues: ["true", "false"]
    Default: "true"
    Description: >-
      Encrypt traffic from the proxies to the nodes. Each node makes a certificate at boot and
      publishes its SHA-256 with its heartbeat; the proxies accept only that certificate. No
      certificate to manage; costs one TLS handshake per pooled connection. On the nodes'
      control API port too, which proxies and other nodes call.
  FrontTls:
    Type: String
    AllowedValues: ["true", "false"]
    Default: "true"
    Description: >-
      Encrypt the hop from the front door to the proxies. With the NLB: TLS target groups, the
      proxies serving a certificate made at boot (the NLB doesn't verify targets). With the
      function URL: the internal NLB passes TLS through, and the function accepts only the
      certificate the proxies derive from a stack secret (ProxyTlsSeed).
  DatabaseMode:
    Type: String
    AllowedValues: [rds, external]
    Default: rds
    Description: >-
      rds: a small RDS for PostgreSQL instance in the stack holds the catalog, ownership leases
      and node records. external: use the Postgres URL in MetadataUrlSecretArn (roll postgres or
      any Postgres 14+).
  DatabaseInstanceClass:
    Type: String
    Default: db.t4g.micro
  DatabaseEngineVersion:
    Type: String
    Default: "17.6"
    Description: With DatabaseMode rds, the PostgreSQL version (14 or later). Minor versions upgrade automatically.
  MetadataUrlSecretArn:
    Type: String
    Default: ""
    Description: With DatabaseMode external, a Secrets Manager secret holding postgres://user:password@host:5432/db?sslmode=require.
  EcsAmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ecs/optimized-ami/amazon-linux-2023/arm64/recommended/image_id

Rules:
  DomainWithCertificate:
    RuleCondition: !Not [!Equals [!Ref CertificateArn, ""]]
    Assertions:
      - Assert: !Not [!Equals [!Ref Domain, ""]]
        AssertDescription: Domain is required with CertificateArn.
  ExternalDatabaseUrl:
    RuleCondition: !Equals [!Ref DatabaseMode, external]
    Assertions:
      - Assert: !Not [!Equals [!Ref MetadataUrlSecretArn, ""]]
        AssertDescription: MetadataUrlSecretArn is required with DatabaseMode external.

Conditions:
  UseNlb: !Not [!Equals [!Ref CertificateArn, ""]]
  UseLambda: !Equals [!Ref CertificateArn, ""]
  UseHostNames: !And [!Condition UseNlb, !Equals [!Ref ClusterHostNames, "true"]]
  UseEc2: !Equals [!Ref NodeCompute, ec2]
  UseFargate: !Equals [!Ref NodeCompute, fargate]
  UseExpress: !Not [!Equals [!Ref ExpressZoneId, ""]]
  UseRds: !Equals [!Ref DatabaseMode, rds]
  ScaleToZero: !Equals [!Ref MinNodes, "0"]
  UseNodeTls: !Equals [!Ref NodeTls, "true"]
  UseNlbFrontTls: !And [!Condition UseNlb, !Equals [!Ref FrontTls, "true"]]
  UseLambdaFrontTls: !And [!Condition UseLambda, !Equals [!Ref FrontTls, "true"]]

Resources:
  # ── network: public subnets, no NAT; S3 through free gateway endpoints ──
  # Nodes and the database have no public address and accept nothing from outside the stack.
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VpcCidr
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags: [{ Key: Name, Value: !Ref AWS::StackName }]
  Gateway:
    Type: AWS::EC2::InternetGateway
  GatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties: { VpcId: !Ref Vpc, InternetGatewayId: !Ref Gateway }
  Routes:
    Type: AWS::EC2::RouteTable
    Properties: { VpcId: !Ref Vpc }
  DefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: GatewayAttachment
    Properties: { RouteTableId: !Ref Routes, DestinationCidrBlock: 0.0.0.0/0, GatewayId: !Ref Gateway }
  SubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [0, !GetAZs ""]
      CidrBlock: !Select [0, !Cidr [!Ref VpcCidr, 4, 12]]
      MapPublicIpOnLaunch: false
  SubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [1, !GetAZs ""]
      CidrBlock: !Select [1, !Cidr [!Ref VpcCidr, 4, 12]]
      MapPublicIpOnLaunch: false
  SubnetC:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [2, !GetAZs ""]
      CidrBlock: !Select [2, !Cidr [!Ref VpcCidr, 4, 12]]
      MapPublicIpOnLaunch: false
  SubnetARoutes:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: { SubnetId: !Ref SubnetA, RouteTableId: !Ref Routes }
  SubnetBRoutes:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: { SubnetId: !Ref SubnetB, RouteTableId: !Ref Routes }
  SubnetCRoutes:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: { SubnetId: !Ref SubnetC, RouteTableId: !Ref Routes }
  S3Endpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref Vpc
      ServiceName: !Sub com.amazonaws.${AWS::Region}.s3
      VpcEndpointType: Gateway
      RouteTableIds: [!Ref Routes]
  S3ExpressEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Condition: UseExpress
    Properties:
      VpcId: !Ref Vpc
      ServiceName: !Sub com.amazonaws.${AWS::Region}.s3express
      VpcEndpointType: Gateway
      RouteTableIds: [!Ref Routes]

  FrontSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: roll search load balancer
      VpcId: !Ref Vpc
      SecurityGroupIngress: !If
        - UseNlb
        - - { IpProtocol: tcp, FromPort: 443, ToPort: 443, CidrIp: !Ref ClientCidr, Description: Elasticsearch REST (TLS) }
          - { IpProtocol: tcp, FromPort: 8443, ToPort: 8443, CidrIp: !Ref ClientCidr, Description: roll search API (TLS) }
        - - { IpProtocol: tcp, FromPort: 9200, ToPort: 9200, CidrIp: !Ref VpcCidr, Description: Elasticsearch REST from the function }
          - { IpProtocol: tcp, FromPort: 7070, ToPort: 7070, CidrIp: !Ref VpcCidr, Description: roll search API from the function }
      SecurityGroupEgress:
        - { IpProtocol: tcp, FromPort: 7070, ToPort: 9200, CidrIp: !Ref VpcCidr, Description: to the proxies }
  LambdaSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Condition: UseLambda
    Properties:
      GroupDescription: roll search function URL
      VpcId: !Ref Vpc
      SecurityGroupEgress:
        - { IpProtocol: tcp, FromPort: 7070, ToPort: 9200, CidrIp: !Ref VpcCidr, Description: to the internal load balancer }
  ProxySecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: roll search proxies
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - { IpProtocol: tcp, FromPort: 9200, ToPort: 9200, SourceSecurityGroupId: !Ref FrontSecurityGroup, Description: Elasticsearch REST }
        - { IpProtocol: tcp, FromPort: 7070, ToPort: 7070, SourceSecurityGroupId: !Ref FrontSecurityGroup, Description: roll search API }
        - { IpProtocol: tcp, FromPort: 8081, ToPort: 8081, CidrIp: !Ref VpcCidr, Description: load balancer health checks }
      # ECS UpdateService (wakes), ECR, logs and secrets through the public IP; nodes and the
      # database inside the VPC.
      SecurityGroupEgress:
        - { IpProtocol: "-1", CidrIp: 0.0.0.0/0 }
  NodeSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: roll search nodes
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - { IpProtocol: tcp, FromPort: 9200, ToPort: 9200, SourceSecurityGroupId: !Ref ProxySecurityGroup, Description: Elasticsearch REST from the proxies }
        - { IpProtocol: tcp, FromPort: 7070, ToPort: 7070, SourceSecurityGroupId: !Ref ProxySecurityGroup, Description: roll search API from the proxies }
      SecurityGroupEgress:
        - { IpProtocol: "-1", CidrIp: 0.0.0.0/0 }
  # Nodes forward control API calls for a cluster to the node that owns it.
  NodeToNode:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref NodeSecurityGroup
      IpProtocol: tcp
      FromPort: 7070
      ToPort: 9200
      SourceSecurityGroupId: !Ref NodeSecurityGroup
      Description: node to node (API forwarding)
  DatabaseSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Condition: UseRds
    Properties:
      GroupDescription: roll search metadata (Postgres)
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - { IpProtocol: tcp, FromPort: 5432, ToPort: 5432, SourceSecurityGroupId: !Ref NodeSecurityGroup, Description: nodes }
        - { IpProtocol: tcp, FromPort: 5432, ToPort: 5432, SourceSecurityGroupId: !Ref ProxySecurityGroup, Description: proxies }
      SecurityGroupEgress:
        - { IpProtocol: "-1", CidrIp: 127.0.0.1/32, Description: none }

  # ── storage ──
  Data:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules: [{ ObjectOwnership: BucketOwnerEnforced }]
      LifecycleConfiguration:
        Rules:
          - Id: abort-incomplete-uploads
            Status: Enabled
            AbortIncompleteMultipartUpload: { DaysAfterInitiation: 1 }
  WalExpress:
    Type: AWS::S3Express::DirectoryBucket
    Condition: UseExpress
    Properties:
      DataRedundancy: SingleAvailabilityZone
      LocationName: !Ref ExpressZoneId

  # ── metadata: catalog, leases, node records ──
  DatabaseSubnets:
    Type: AWS::RDS::DBSubnetGroup
    Condition: UseRds
    Properties:
      DBSubnetGroupDescription: roll search metadata
      SubnetIds: [!Ref SubnetA, !Ref SubnetB, !Ref SubnetC]
  Database:
    Type: AWS::RDS::DBInstance
    Condition: UseRds
    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot
    Properties:
      Engine: postgres
      EngineVersion: !Ref DatabaseEngineVersion
      DBInstanceClass: !Ref DatabaseInstanceClass
      AllocatedStorage: "20"
      StorageType: gp3
      StorageEncrypted: true
      DBName: roll_search
      MasterUsername: roll
      # A stack-owned secret, not an RDS-managed one: RDS rotates its own weekly, and tasks read
      # the password once, at start.
      MasterUserPassword: !Sub "{{resolve:secretsmanager:${DatabasePassword}:SecretString:password}}"
      DBSubnetGroupName: !Ref DatabaseSubnets
      VPCSecurityGroups: [!Ref DatabaseSecurityGroup]
      PubliclyAccessible: false
      BackupRetentionPeriod: 7
      AutoMinorVersionUpgrade: true
      DeletionProtection: false
      EnablePerformanceInsights: false

  DatabasePassword:
    Type: AWS::SecretsManager::Secret
    Condition: UseRds
    Properties:
      Description: roll search metadata database (user roll)
      GenerateSecretString:
        SecretStringTemplate: '{"username":"roll"}'
        GenerateStringKey: password
        PasswordLength: 40
        ExcludePunctuation: true

  # Bearer token for the control API (/v1/search): the dashboard and `roll search` use it.
  ApiToken:
    Type: AWS::SecretsManager::Secret
    Properties:
      Description: roll search control API token
      GenerateSecretString: { PasswordLength: 48, ExcludePunctuation: true }

  # The proxies and the function derive the proxies' TLS certificate from it (Ed25519, the same
  # everywhere), so the function pins it with nothing to distribute or rotate.
  ProxyTlsSeed:
    Type: AWS::SecretsManager::Secret
    Condition: UseLambdaFrontTls
    Properties:
      Description: roll search proxy TLS seed (function URL to proxies)
      GenerateSecretString: { PasswordLength: 48, ExcludePunctuation: true }

  # ── ECS ──
  Cluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterSettings: [{ Name: containerInsights, Value: disabled }]
  Logs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /ecs/${AWS::StackName}
      RetentionInDays: 14

  # Node instances (ec2): Graviton, an on-demand base plus Spot from many pools.
  NodeInstanceRole:
    Type: AWS::IAM::Role
    Condition: UseEc2
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement: [{ Effect: Allow, Principal: { Service: ec2.amazonaws.com }, Action: sts:AssumeRole }]
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonEC2ContainerServiceforEC2Role
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
  NodeInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Condition: UseEc2
    Properties: { Roles: [!Ref NodeInstanceRole] }
  NodeLaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Condition: UseEc2
    Properties:
      LaunchTemplateData:
        ImageId: !Ref EcsAmiId
        IamInstanceProfile: { Arn: !GetAtt NodeInstanceProfile.Arn }
        # A public address only for the ECS agent, image pulls and logs (no NAT); the security
        # group admits nothing from outside.
        NetworkInterfaces:
          - DeviceIndex: 0
            AssociatePublicIpAddress: true
            Groups: [!Ref NodeSecurityGroup]
            DeleteOnTermination: true
        # Hop limit 1: tasks get credentials from their task role, never from the instance.
        MetadataOptions: { HttpTokens: required, HttpPutResponseHopLimit: 1 }
        # The root volume (the AMI's 30 GiB) holds the OS, the ECS agent and Docker; the node's
        # disk is a volume of its own, so a full cache can never fill the root filesystem.
        BlockDeviceMappings:
          - DeviceName: /dev/xvda
            Ebs:
              VolumeType: gp3
              VolumeSize: 30
              Encrypted: true
              DeleteOnTermination: true
          - DeviceName: /dev/xvdb
            Ebs:
              VolumeType: gp3
              VolumeSize: !Ref NodeCacheGiB
              Encrypted: true
              DeleteOnTermination: true
        TagSpecifications: [{ ResourceType: instance, Tags: [{ Key: Name, Value: !Sub "${AWS::StackName}-node" }] }]
        UserData:
          Fn::Base64: !Sub |
            #!/bin/bash
            set -euo pipefail
            # The data volume, mounted where the node task binds /data. Nitro instances name it
            # nvme<N>n1 (amazon-ec2-utils links /dev/xvdb to it); otherwise take the blank EBS
            # disk (no partitions, no signature, not mounted; instance store NVMe disks of `d`
            # types are blank too, and never taken). Without it the instance powers off before
            # the ECS agent starts (it runs after cloud-final), so the Auto Scaling group
            # replaces it, rather than run a node whose cache fills the root filesystem.
            dev=""
            for _ in $(seq 1 120); do
              if [ -b /dev/xvdb ]; then dev=$(readlink -f /dev/xvdb); break; fi
              for d in $(lsblk -dnpo NAME,TYPE | awk '$2 == "disk" { print $1 }'); do
                case "$(lsblk -dno MODEL "$d")" in *"Instance Storage"*) continue ;; esac
                if [ "$(lsblk -nro NAME "$d" | wc -l)" = 1 ] && [ -z "$(lsblk -dnro MOUNTPOINT "$d")" ] && ! blkid -p "$d" >/dev/null 2>&1; then
                  dev=$d
                  break
                fi
              done
              [ -n "$dev" ] && break
              sleep 1
            done
            [ -n "$dev" ] || { echo "roll search: no data volume; powering off" >&2; poweroff; exit 1; }
            blkid "$dev" >/dev/null || mkfs.xfs -q "$dev"
            mkdir -p /var/lib/roll-search
            echo "UUID=$(blkid -s UUID -o value "$dev") /var/lib/roll-search xfs noatime,nofail 0 2" >> /etc/fstab
            mount /var/lib/roll-search
            chown 10001:10001 /var/lib/roll-search
            cat >> /etc/ecs/ecs.config <<EOF
            ECS_CLUSTER=${Cluster}
            ECS_ENABLE_SPOT_INSTANCE_DRAINING=true
            ECS_CONTAINER_STOP_TIMEOUT=120s
            ECS_ENABLE_CONTAINER_METADATA=true
            EOF
  NodeGroup:
    Type: AWS::AutoScaling::AutoScalingGroup
    Condition: UseEc2
    Properties:
      VPCZoneIdentifier: [!Ref SubnetA, !Ref SubnetB, !Ref SubnetC]
      MinSize: "0"
      # ECS managed scaling sets the desired count (one instance per node task, distinctInstance)
      # and NodeScaling caps the tasks at MaxNodes, so this is no cost limit. It must leave room
      # for a deploy: MaximumPercent 200 starts each new node on an instance of its own before
      # the old one stops, up to 2 × MaxNodes instances. A MaxSize of MaxNodes would leave the
      # new tasks unplaceable at full size (a fleet with MaxNodes 1 at every deploy), and the
      # circuit breaker would roll the deploy back.
      MaxSize: "200"
      # Instances running nodes are protected from scale-in until ECS has moved their tasks.
      NewInstancesProtectedFromScaleIn: true
      # Replace Spot instances at elevated risk of interruption before AWS takes them.
      CapacityRebalance: true
      MixedInstancesPolicy:
        InstancesDistribution:
          OnDemandBaseCapacity: !Ref OnDemandNodes
          OnDemandPercentageAboveBaseCapacity: 0
          SpotAllocationStrategy: price-capacity-optimized
        LaunchTemplate:
          LaunchTemplateSpecification: { LaunchTemplateId: !Ref NodeLaunchTemplate, Version: !GetAtt NodeLaunchTemplate.LatestVersionNumber }
          Overrides:
            - InstanceRequirements:
                VCpuCount: { Min: !Ref NodeVcpus, Max: !Ref NodeVcpus }
                MemoryMiB: { Min: !Ref NodeInstanceMemoryMiB }
                CpuManufacturers: [amazon-web-services]
                InstanceGenerations: [current]
                BurstablePerformance: excluded
      Tags: [{ Key: Name, Value: !Sub "${AWS::StackName}-node", PropagateAtLaunch: true }]
  NodeCapacity:
    Type: AWS::ECS::CapacityProvider
    Condition: UseEc2
    Properties:
      AutoScalingGroupProvider:
        AutoScalingGroupArn: !Ref NodeGroup
        ManagedScaling: { Status: ENABLED, TargetCapacity: 100 }
        ManagedTerminationProtection: ENABLED
        ManagedDraining: ENABLED
  ClusterCapacity:
    Type: AWS::ECS::ClusterCapacityProviderAssociations
    Properties:
      Cluster: !Ref Cluster
      CapacityProviders: !If [UseEc2, [FARGATE, FARGATE_SPOT, !Ref NodeCapacity], [FARGATE, FARGATE_SPOT]]
      DefaultCapacityProviderStrategy: [{ CapacityProvider: FARGATE, Weight: 1 }]

  ExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
            Condition:
              StringEquals: { aws:SourceAccount: !Ref AWS::AccountId }
      ManagedPolicyArns: [arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy]
      Policies:
        - PolicyName: secrets
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource:
                  - !Ref ApiToken
                  - !If [UseRds, !Ref DatabasePassword, !Ref MetadataUrlSecretArn]
                  - !If [UseLambdaFrontTls, !Ref ProxyTlsSeed, !Ref AWS::NoValue]

  NodeTaskRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
            Condition:
              StringEquals: { aws:SourceAccount: !Ref AWS::AccountId }
      Policies:
        - PolicyName: data
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [s3:GetObject, s3:PutObject, s3:DeleteObject, s3:AbortMultipartUpload]
                Resource: !Sub "${Data.Arn}/*"
              - Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt Data.Arn
              - !If
                - UseExpress
                - Effect: Allow
                  Action: s3express:CreateSession
                  Resource: !GetAtt WalExpress.Arn
                - !Ref AWS::NoValue

  NodeTask:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub ${AWS::StackName}-node
      RequiresCompatibilities: !If [UseEc2, [EC2], [FARGATE]]
      NetworkMode: awsvpc
      RuntimePlatform: { CpuArchitecture: ARM64, OperatingSystemFamily: LINUX }
      Cpu: !Ref NodeCpu
      Memory: !Ref NodeMemory
      EphemeralStorage: !If [UseFargate, { SizeInGiB: !Ref NodeCacheGiB }, !Ref AWS::NoValue]
      # ec2: /data is the instance's data volume (one node per instance, distinctInstance).
      Volumes: !If [UseEc2, [{ Name: data, Host: { SourcePath: /var/lib/roll-search } }], !Ref AWS::NoValue]
      ExecutionRoleArn: !GetAtt ExecutionRole.Arn
      TaskRoleArn: !GetAtt NodeTaskRole.Arn
      ContainerDefinitions:
        - Name: node
          Image: !Ref ImageUri
          Essential: true
          # Byte figures from the sizes above: the cache leaves a tenth of the disk (at least
          # 2 GiB) for the WAL, segments being written and the filesystem; loaded clusters may
          # hold three quarters of the task's memory. An ec2 instance's data volume outlives
          # its tasks: the next node keeps the warm segment cache, but not the WAL files of the
          # one before (acknowledged writes are in S3 already, and WAL files are named by node).
          Command:
            - sh
            - -c
            - >-
              rm -rf /data/search/cache/wal;
              export ROLL_SEARCH_CACHE_BYTES=$(( (ROLL_SEARCH_CACHE_GIB - (ROLL_SEARCH_CACHE_GIB / 10 > 2 ? ROLL_SEARCH_CACHE_GIB / 10 : 2)) << 30 ))
              ROLL_SEARCH_MEMORY_MB=$(( ROLL_SEARCH_TASK_MEMORY_MB * 3 / 4 ));
              exec rolld
          MountPoints: !If [UseEc2, [{ SourceVolume: data, ContainerPath: /data }], !Ref AWS::NoValue]
          # SIGTERM (deploys, scale-in, Spot reclaims): publish draining, flush every cluster and
          # hand its lease back, then leave. The whole stop takes at most
          # ROLL_SEARCH_SHUTDOWN_TIMEOUT (100 s: 85 s of handing over, 15 s for leaving the fleet
          # and the last connections), inside this and Spot's two minutes from the notice.
          StopTimeout: 120
          Ulimits: [{ Name: nofile, SoftLimit: 65536, HardLimit: 65536 }]
          Environment:
            - { Name: ROLL_SEARCH_ONLY, Value: "1" }
            - { Name: ROLL_API, Value: "0.0.0.0:7070" }
            - { Name: ROLL_SEARCH_HTTP, Value: "0.0.0.0:9200" }
            - { Name: ROLL_S3_BUCKET, Value: !Ref Data }
            - { Name: AWS_REGION, Value: !Ref AWS::Region }
            - { Name: ROLL_SEARCH_SYNC_OBJECTS, Value: "1" }
            - { Name: ROLL_SEARCH_IDLE_UNLOAD, Value: !Ref IdleClusterSeconds }
            - { Name: ROLL_SEARCH_SHUTDOWN_TIMEOUT, Value: "100" }
            - { Name: ROLL_SEARCH_CACHE_GIB, Value: !Ref NodeCacheGiB }
            - { Name: ROLL_SEARCH_TASK_MEMORY_MB, Value: !Ref NodeMemory }
            - Name: ROLL_SEARCH_PUBLIC_URL
              Value: !If [UseNlb, !Sub "https://${Domain}", !GetAtt ProxyUrl.FunctionUrl]
            - !If [UseHostNames, { Name: ROLL_SEARCH_DOMAIN, Value: !Ref Domain }, !Ref AWS::NoValue]
            - !If [UseNodeTls, { Name: ROLL_SEARCH_TLS_SELF_SIGNED, Value: "1" }, !Ref AWS::NoValue]
            - !If [UseExpress, { Name: ROLL_SEARCH_WAL_BUCKET, Value: !Ref WalExpress }, !Ref AWS::NoValue]
            - !If
              - UseRds
              - Name: ROLL_SEARCH_META
                Value: !Sub "postgres://roll@${Database.Endpoint.Address}:${Database.Endpoint.Port}/roll_search?sslmode=require"
              - !Ref AWS::NoValue
          Secrets:
            - { Name: ROLL_SEARCH_API_TOKEN, ValueFrom: !Ref ApiToken }
            - !If
              - UseRds
              - { Name: ROLL_SEARCH_META_PASSWORD, ValueFrom: !Sub "${DatabasePassword}:password::" }
              - { Name: ROLL_SEARCH_META, ValueFrom: !Ref MetadataUrlSecretArn }
          PortMappings:
            - { ContainerPort: 9200, Protocol: tcp }
            - { ContainerPort: 7070, Protocol: tcp }
          LogConfiguration:
            LogDriver: awslogs
            Options: { awslogs-group: !Ref Logs, awslogs-region: !Ref AWS::Region, awslogs-stream-prefix: node }

  NodeService:
    Type: AWS::ECS::Service
    DependsOn: ClusterCapacity
    Properties:
      Cluster: !Ref Cluster
      TaskDefinition: !Ref NodeTask
      # No DesiredCount: autoscaling and the proxies' wakes own it, and stack updates must not
      # reset it.
      CapacityProviderStrategy: !If
        - UseEc2
        - [{ CapacityProvider: !Ref NodeCapacity, Weight: 1 }]
        - - { CapacityProvider: FARGATE, Base: !Ref OnDemandNodes, Weight: 0 }
          - { CapacityProvider: FARGATE_SPOT, Weight: 1 }
      # One node per AZ before any AZ gets a second (EC2; Fargate spreads by itself).
      PlacementStrategies: !If
        - UseEc2
        - [{ Type: spread, Field: attribute:ecs.availability-zone }, { Type: binpack, Field: memory }]
        - !Ref AWS::NoValue
      # The instance's data volume is one node's disk.
      PlacementConstraints: !If [UseEc2, [{ Type: distinctInstance }], !Ref AWS::NoValue]
      # New nodes join before old ones hand their clusters over: deploys keep serving.
      DeploymentConfiguration:
        MinimumHealthyPercent: 100
        MaximumPercent: 200
        DeploymentCircuitBreaker: { Enable: true, Rollback: true }
      NetworkConfiguration:
        AwsvpcConfiguration:
          # Fargate tasks pull and log through a public address (no NAT); EC2 tasks don't need one.
          AssignPublicIp: !If [UseFargate, ENABLED, DISABLED]
          Subnets: [!Ref SubnetA, !Ref SubnetB, !Ref SubnetC]
          SecurityGroups: [!Ref NodeSecurityGroup]

  # ── autoscaling: out on CPU, in one node at a time, to zero only when nobody calls ──
  NodeScaling:
    Type: AWS::ApplicationAutoScaling::ScalableTarget
    Properties:
      ServiceNamespace: ecs
      ScalableDimension: ecs:service:DesiredCount
      ResourceId: !Sub "service/${Cluster}/${NodeService.Name}"
      MinCapacity: !Ref MinNodes
      MaxCapacity: !Ref MaxNodes
  NodeCpuTracking:
    Type: AWS::ApplicationAutoScaling::ScalingPolicy
    Properties:
      PolicyName: !Sub "${AWS::StackName}-cpu-out"
      PolicyType: TargetTrackingScaling
      ScalingTargetId: !Ref NodeScaling
      TargetTrackingScalingPolicyConfiguration:
        TargetValue: !Ref CpuTarget
        DisableScaleIn: true
        ScaleOutCooldown: 60
        PredefinedMetricSpecification: { PredefinedMetricType: ECSServiceAverageCPUUtilization }
  ScaleInPolicy:
    Type: AWS::ApplicationAutoScaling::ScalingPolicy
    Properties:
      PolicyName: !Sub "${AWS::StackName}-cpu-in"
      PolicyType: StepScaling
      ScalingTargetId: !Ref NodeScaling
      StepScalingPolicyConfiguration:
        AdjustmentType: ChangeInCapacity
        Cooldown: 300
        StepAdjustments: [{ MetricIntervalLowerBound: 0, ScalingAdjustment: -1 }]
  # Mostly idle with more than one node: remove one (its clusters move with their leases). The
  # last node only stops through the idle alarm below.
  ScaleInAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: roll search nodes are mostly idle and there is more than one
      EvaluationPeriods: 15
      DatapointsToAlarm: 15
      # The 0/1 expression breaches by +0.5: inside the step's [0, ∞).
      Threshold: 0.5
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref ScaleInPolicy]
      Metrics:
        - Id: cpu
          ReturnData: false
          MetricStat:
            Metric:
              Namespace: AWS/ECS
              MetricName: CPUUtilization
              Dimensions: [{ Name: ClusterName, Value: !Ref Cluster }, { Name: ServiceName, Value: !GetAtt NodeService.Name }]
            Period: 60
            Stat: Average
        - Id: tasks
          ReturnData: false
          MetricStat:
            Metric:
              Namespace: AWS/ECS
              MetricName: CPUUtilization
              Dimensions: [{ Name: ClusterName, Value: !Ref Cluster }, { Name: ServiceName, Value: !GetAtt NodeService.Name }]
            Period: 60
            # One CPU sample per running task per minute.
            Stat: SampleCount
        - Id: shrink
          Expression: !Sub "IF(cpu < ${CpuTarget} / 3 AND tasks > 1, 1, 0)"
          ReturnData: true
  # Scale to zero: nodes running and no byte through the load balancer for IdleMinutesToZero
  # minutes → no nodes. Health checks don't count. The proxies stay up and start a node on the
  # next request. A minute without running nodes doesn't breach, so the alarm returns to OK
  # once the fleet is at zero: an alarm left in ALARM would re-run its scaling action every
  # minute and stop the node a wake just started, before the load balancer's metrics show the
  # request that woke it.
  ToZeroPolicy:
    Type: AWS::ApplicationAutoScaling::ScalingPolicy
    Condition: ScaleToZero
    Properties:
      PolicyName: !Sub "${AWS::StackName}-to-zero"
      PolicyType: StepScaling
      ScalingTargetId: !Ref NodeScaling
      StepScalingPolicyConfiguration:
        AdjustmentType: ExactCapacity
        # The alarm stays in ALARM through the drain and the metric lag after the stop, and an
        # alarm in ALARM re-runs its policy every minute: this keeps it from stopping the node a
        # wake starts meanwhile (tests/search/aws/model.py).
        Cooldown: 600
        # The 0/1 expression breaches its 0.5 threshold by +0.5, inside [0, ∞) whichever bound
        # AWS counts as inclusive. An upper bound of 0 would cover only breaches below the
        # threshold, which this alarm never has, so it would never act.
        StepAdjustments: [{ MetricIntervalLowerBound: 0, ScalingAdjustment: 0 }]
  IdleAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: ScaleToZero
    Properties:
      AlarmDescription: roll search nodes are running and have had no requests
      EvaluationPeriods: !Ref IdleMinutesToZero
      DatapointsToAlarm: !Ref IdleMinutesToZero
      Threshold: 0.5
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref ToZeroPolicy]
      Metrics:
        - Id: bytes
          ReturnData: false
          MetricStat:
            Metric:
              Namespace: AWS/NetworkELB
              MetricName: ProcessedBytes
              Dimensions: [{ Name: LoadBalancer, Value: !GetAtt FrontDoor.LoadBalancerFullName }]
            Period: 60
            Stat: Sum
        - Id: tasks
          ReturnData: false
          MetricStat:
            Metric:
              Namespace: AWS/ECS
              MetricName: CPUUtilization
              Dimensions: [{ Name: ClusterName, Value: !Ref Cluster }, { Name: ServiceName, Value: !GetAtt NodeService.Name }]
            Period: 60
            Stat: SampleCount
        # The load balancer publishes nothing for a minute without traffic: missing is 0.
        - Id: idle
          Expression: "IF(FILL(bytes, 0) == 0 AND FILL(tasks, 0) > 0, 1, 0)"
          ReturnData: true

  # ── proxies: Fargate arm64, a quarter vCPU, spread over the AZs ──
  ProxyTaskRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
            Condition:
              StringEquals: { aws:SourceAccount: !Ref AWS::AccountId }
      Policies:
        - PolicyName: wake
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - { Effect: Allow, Action: [ecs:DescribeServices, ecs:UpdateService], Resource: !Ref NodeService }
  ProxyTask:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub ${AWS::StackName}-proxy
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      RuntimePlatform: { CpuArchitecture: ARM64, OperatingSystemFamily: LINUX }
      Cpu: "256"
      Memory: "512"
      ExecutionRoleArn: !GetAtt ExecutionRole.Arn
      TaskRoleArn: !GetAtt ProxyTaskRole.Arn
      ContainerDefinitions:
        - Name: proxy
          Image: !Ref ImageUri
          Command: [search-proxy]
          Essential: true
          # Finishes requests in progress (the load balancer deregisters it first).
          StopTimeout: 60
          Ulimits: [{ Name: nofile, SoftLimit: 65536, HardLimit: 65536 }]
          Environment:
            - { Name: ROLL_SEARCH_PROXY_LISTEN, Value: "0.0.0.0:9200" }
            - { Name: ROLL_SEARCH_PROXY_API_LISTEN, Value: "0.0.0.0:7070" }
            - { Name: ROLL_SEARCH_PROXY_HEALTH, Value: "0.0.0.0:8081" }
            - { Name: ROLL_SEARCH_PROXY_DRAIN, Value: "45" }
            # Under the function's timeout, so a cold start answers 503 rather than timing out.
            - { Name: ROLL_SEARCH_PROXY_HOLD_TIMEOUT, Value: "120" }
            - { Name: ROLL_SEARCH_PROXY_PROTOCOL, Value: !If [UseNlb, "true", "false"] }
            # Behind TLS target groups (the PROXY header comes before the handshake).
            - !If [UseNlbFrontTls, { Name: ROLL_SEARCH_PROXY_TLS_SELF_SIGNED, Value: "1" }, !Ref AWS::NoValue]
            - { Name: ROLL_SEARCH_PROXY_WAKE_ECS_SERVICE, Value: !Sub "${Cluster}/${NodeService.Name}" }
            - { Name: ROLL_SEARCH_PROXY_WAKE_COUNT, Value: "1" }
            - { Name: AWS_REGION, Value: !Ref AWS::Region }
            - !If [UseHostNames, { Name: ROLL_SEARCH_DOMAIN, Value: !Ref Domain }, !Ref AWS::NoValue]
            - !If
              - UseRds
              - Name: ROLL_SEARCH_META
                Value: !Sub "postgres://roll@${Database.Endpoint.Address}:${Database.Endpoint.Port}/roll_search?sslmode=require"
              - !Ref AWS::NoValue
          Secrets:
            - !If
              - UseRds
              - { Name: ROLL_SEARCH_META_PASSWORD, ValueFrom: !Sub "${DatabasePassword}:password::" }
              - { Name: ROLL_SEARCH_META, ValueFrom: !Ref MetadataUrlSecretArn }
            - !If [UseLambdaFrontTls, { Name: ROLL_SEARCH_PROXY_TLS_SEED, ValueFrom: !Ref ProxyTlsSeed }, !Ref AWS::NoValue]
          PortMappings:
            - { ContainerPort: 9200, Protocol: tcp }
            - { ContainerPort: 7070, Protocol: tcp }
            - { ContainerPort: 8081, Protocol: tcp }
          LogConfiguration:
            LogDriver: awslogs
            Options: { awslogs-group: !Ref Logs, awslogs-region: !Ref AWS::Region, awslogs-stream-prefix: proxy }
  ProxyService:
    Type: AWS::ECS::Service
    DependsOn: [ClusterCapacity, RestListener, ApiListener]
    Properties:
      Cluster: !Ref Cluster
      TaskDefinition: !Ref ProxyTask
      DesiredCount: !Ref ProxyCount
      CapacityProviderStrategy: [{ CapacityProvider: FARGATE, Weight: 1 }]
      DeploymentConfiguration:
        MinimumHealthyPercent: 100
        MaximumPercent: 200
        DeploymentCircuitBreaker: { Enable: true, Rollback: true }
      HealthCheckGracePeriodSeconds: 30
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          Subnets: [!Ref SubnetA, !Ref SubnetB, !Ref SubnetC]
          SecurityGroups: [!Ref ProxySecurityGroup]
      LoadBalancers:
        - { ContainerName: proxy, ContainerPort: 9200, TargetGroupArn: !Ref RestTargets }
        - { ContainerName: proxy, ContainerPort: 7070, TargetGroupArn: !Ref ApiTargets }

  # ── front door: a Network Load Balancer (internet-facing with TLS, or internal behind the
  # function URL). Cross-zone off: a flow stays in its AZ, and so does its proxy's node choice.
  FrontDoor:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Type: network
      Scheme: !If [UseNlb, internet-facing, internal]
      IpAddressType: ipv4
      Subnets: [!Ref SubnetA, !Ref SubnetB, !Ref SubnetC]
      SecurityGroups: [!Ref FrontSecurityGroup]
      LoadBalancerAttributes: [{ Key: load_balancing.cross_zone.enabled, Value: "false" }]
  # Health checks hit the proxy's health port, which never touches nodes: they don't wake a
  # fleet that scaled to zero.
  RestTargets:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      VpcId: !Ref Vpc
      TargetType: ip
      # TLS: the NLB re-encrypts to the proxies. Behind the function the internal NLB's TCP
      # listener passes the function's own TLS through.
      Protocol: !If [UseNlbFrontTls, TLS, TCP]
      Port: 9200
      HealthCheckProtocol: HTTP
      HealthCheckPort: "8081"
      HealthCheckPath: /
      HealthCheckIntervalSeconds: 10
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 2
      TargetGroupAttributes:
        - { Key: deregistration_delay.timeout_seconds, Value: "30" }
        # The client's address reaches the nodes (X-Forwarded-For) through the PROXY protocol.
        - { Key: proxy_protocol_v2.enabled, Value: !If [UseNlb, "true", "false"] }
  ApiTargets:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      VpcId: !Ref Vpc
      TargetType: ip
      Protocol: !If [UseNlbFrontTls, TLS, TCP]
      Port: 7070
      HealthCheckProtocol: HTTP
      HealthCheckPort: "8081"
      HealthCheckPath: /
      HealthCheckIntervalSeconds: 10
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 2
      TargetGroupAttributes:
        - { Key: deregistration_delay.timeout_seconds, Value: "30" }
        - { Key: proxy_protocol_v2.enabled, Value: !If [UseNlb, "true", "false"] }
  RestListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref FrontDoor
      Protocol: !If [UseNlb, TLS, TCP]
      Port: !If [UseNlb, 443, 9200]
      Certificates: !If [UseNlb, [{ CertificateArn: !Ref CertificateArn }], !Ref AWS::NoValue]
      SslPolicy: !If [UseNlb, ELBSecurityPolicy-TLS13-1-2-2021-06, !Ref AWS::NoValue]
      DefaultActions: [{ Type: forward, TargetGroupArn: !Ref RestTargets }]
  ApiListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref FrontDoor
      Protocol: !If [UseNlb, TLS, TCP]
      Port: !If [UseNlb, 8443, 7070]
      Certificates: !If [UseNlb, [{ CertificateArn: !Ref CertificateArn }], !Ref AWS::NoValue]
      SslPolicy: !If [UseNlb, ELBSecurityPolicy-TLS13-1-2-2021-06, !Ref AWS::NoValue]
      DefaultActions: [{ Type: forward, TargetGroupArn: !Ref ApiTargets }]

  # ── … or a Lambda function URL in front of the internal load balancer ──
  ProxyFunctionRole:
    Type: AWS::IAM::Role
    Condition: UseLambda
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement: [{ Effect: Allow, Principal: { Service: lambda.amazonaws.com }, Action: sts:AssumeRole }]
      ManagedPolicyArns: [arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole]
  ProxyFunctionLogs:
    Type: AWS::Logs::LogGroup
    Condition: UseLambda
    Properties:
      LogGroupName: !Sub /aws/lambda/${AWS::StackName}-front
      RetentionInDays: 14
  ProxyFunction:
    Type: AWS::Lambda::Function
    Condition: UseLambda
    DependsOn: ProxyFunctionLogs
    Properties:
      FunctionName: !Sub ${AWS::StackName}-front
      PackageType: Image
      Code: { ImageUri: !Ref ImageUri }
      # Both set: Lambda passes the image's CMD (rolld) to an overridden entrypoint otherwise.
      ImageConfig: { EntryPoint: [/usr/local/bin/search-proxy], Command: [--lambda] }
      Architectures: [arm64]
      MemorySize: 256
      # Room for a request held through a cold start of the fleet (the proxies give up at 120 s).
      Timeout: 150
      Role: !GetAtt ProxyFunctionRole.Arn
      VpcConfig:
        SubnetIds: [!Ref SubnetA, !Ref SubnetB, !Ref SubnetC]
        SecurityGroupIds: [!Ref LambdaSecurityGroup]
      Environment:
        Variables:
          ROLL_SEARCH_LAMBDA_UPSTREAM: !If [UseLambdaFrontTls, !Sub "https://${FrontDoor.DNSName}:9200", !Sub "http://${FrontDoor.DNSName}:9200"]
          ROLL_SEARCH_LAMBDA_API_UPSTREAM: !If [UseLambdaFrontTls, !Sub "https://${FrontDoor.DNSName}:7070", !Sub "http://${FrontDoor.DNSName}:7070"]
          # Resolved at deploy time into the function's configuration (no NAT, so the function
          # can't reach Secrets Manager itself); readable by whoever may read that. The short
          # form (the whole secret string) is the one LocalStack resolves too.
          ROLL_SEARCH_LAMBDA_TLS_SEED: !If [UseLambdaFrontTls, !Sub "{{resolve:secretsmanager:${ProxyTlsSeed}}}", !Ref AWS::NoValue]
  ProxyUrl:
    Type: AWS::Lambda::Url
    Condition: UseLambda
    Properties:
      TargetFunctionArn: !GetAtt ProxyFunction.Arn
      AuthType: NONE
      InvokeMode: BUFFERED
  ProxyUrlPermission:
    Type: AWS::Lambda::Permission
    Condition: UseLambda
    Properties:
      FunctionName: !Ref ProxyFunction
      Action: lambda:InvokeFunctionUrl
      Principal: "*"
      FunctionUrlAuthType: NONE
  ProxyInvokePermission:
    Type: AWS::Lambda::Permission
    Condition: UseLambda
    Properties:
      FunctionName: !Ref ProxyFunction
      Action: lambda:InvokeFunction
      Principal: "*"
      # Only through the URL: no direct invokes.
      InvokedViaFunctionUrl: true

Outputs:
  Endpoint:
    Description: Elasticsearch REST endpoint for every cluster (clusters authenticate with their own credentials).
    Value: !If [UseNlb, !Sub "https://${Domain}", !GetAtt ProxyUrl.FunctionUrl]
  ApiUrl:
    Description: Control API base URL (/v1/search) for `roll search` (ROLL_API_URL, with ROLL_API_KEY = the ApiTokenSecret value) and the dashboard.
    Value: !If [UseNlb, !Sub "https://${Domain}:8443", !GetAtt ProxyUrl.FunctionUrl]
  ApiTokenSecret:
    Value: !Ref ApiToken
  LoadBalancer:
    Condition: UseNlb
    Description: Point Domain (and *.Domain with ClusterHostNames) here (CNAME or alias).
    Value: !GetAtt FrontDoor.DNSName
  Bucket:
    Description: Segments, manifests, cluster states (and the WAL unless ExpressZoneId is set).
    Value: !Ref Data
  WalBucket:
    Condition: UseExpress
    Value: !Ref WalExpress
  Cluster:
    Value: !Ref Cluster
  NodeService:
    Value: !GetAtt NodeService.Name
  DatabaseSecret:
    Condition: UseRds
    Description: The metadata database's credentials (user roll).
    Value: !Ref DatabasePassword
