# nginx as roll code's load balancer (docker-compose.yml): any request to any node, no stickiness.
# Open-source nginx has no active health checks: a node that refuses connections or answers 502/503
# is skipped for 10 s (max_fails), and requests that never reached a node are retried on another.
# A production load balancer should also poll GET /v1/code/health (deploy/code/README.md).
worker_processes auto;
events { worker_connections 4096; }

http {
  # Re-resolve the nodes' addresses as their containers restart.
  resolver 127.0.0.11 valid=5s ipv6=off;

  upstream roll_code {
    zone roll_code 64k;
    server node1:7070 max_fails=1 fail_timeout=10s resolve;
    server node2:7070 max_fails=1 fail_timeout=10s resolve;
    server node3:7070 max_fails=1 fail_timeout=10s resolve;
    keepalive 64;
  }

  server {
    listen 7070;
    # API writes take up to 64 MiB; git pushes stream (the nodes bound their memory).
    client_max_body_size 0;

    location / {
      proxy_pass http://roll_code;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      # git packs and event streams flow through as they come.
      proxy_request_buffering off;
      proxy_buffering off;
      # A node holds a request for up to ~13 s while its repo moves between nodes.
      proxy_connect_timeout 5s;
      proxy_send_timeout 300s;
      proxy_read_timeout 300s;
      # Requests that never reached a node are retried on another (nginx never resends a POST
      # that was sent); a draining node's 503 is retried for idempotent requests.
      proxy_next_upstream error timeout http_502 http_503;
      proxy_next_upstream_tries 3;
    }

    # Event streams stay open for long.
    location ~ /events$ {
      proxy_pass http://roll_code;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_buffering off;
      proxy_read_timeout 1h;
    }
  }
}
