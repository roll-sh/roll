  # Listeners: 443 → 8443, the rest 1:1. Idle connections (database pools, MQTT keep-alives,
  # WebSockets) live an hour rather than the NLB's default 350 s.
  Listener443:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Protocol: TCP
      Port: 443
      DefaultActions: [{ Type: forward, TargetGroupArn: !Ref Tg8443 }]
      ListenerAttributes:
        - { Key: tcp.idle_timeout.seconds, Value: "3600" }
  Listener5432:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Protocol: TCP
      Port: 5432
      DefaultActions: [{ Type: forward, TargetGroupArn: !Ref Tg5432 }]
      ListenerAttributes:
        - { Key: tcp.idle_timeout.seconds, Value: "3600" }
  Listener6379:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Protocol: TCP
      Port: 6379
      DefaultActions: [{ Type: forward, TargetGroupArn: !Ref Tg6379 }]
      ListenerAttributes:
        - { Key: tcp.idle_timeout.seconds, Value: "3600" }
  Listener9092:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Protocol: TCP
      Port: 9092
      DefaultActions: [{ Type: forward, TargetGroupArn: !Ref Tg9092 }]
      ListenerAttributes:
        - { Key: tcp.idle_timeout.seconds, Value: "3600" }
  Listener9042:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Protocol: TCP
      Port: 9042
      DefaultActions: [{ Type: forward, TargetGroupArn: !Ref Tg9042 }]
      ListenerAttributes:
        - { Key: tcp.idle_timeout.seconds, Value: "3600" }
  Listener5671:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Protocol: TCP
      Port: 5671
      DefaultActions: [{ Type: forward, TargetGroupArn: !Ref Tg5671 }]
      ListenerAttributes:
        - { Key: tcp.idle_timeout.seconds, Value: "3600" }
  Listener8883:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Protocol: TCP
      Port: 8883
      DefaultActions: [{ Type: forward, TargetGroupArn: !Ref Tg8883 }]
      ListenerAttributes:
        - { Key: tcp.idle_timeout.seconds, Value: "3600" }
  Listener61614:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Protocol: TCP
      Port: 61614
      DefaultActions: [{ Type: forward, TargetGroupArn: !Ref Tg61614 }]
      ListenerAttributes:
        - { Key: tcp.idle_timeout.seconds, Value: "3600" }
  Listener5551:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Protocol: TCP
      Port: 5551
      DefaultActions: [{ Type: forward, TargetGroupArn: !Ref Tg5551 }]
      ListenerAttributes:
        - { Key: tcp.idle_timeout.seconds, Value: "3600" }

  # ── alarms: each one fails a canary's bake (deploy.sh); all but CapacityAlarm also roll a
  # deploy of NodeService back ──
  # Fewer healthy nodes than the floor for three minutes. Deploys never get here: they add a
  # node before they stop one. (Unhealthy hosts alone are normal: an instance between tasks.)
  CapacityAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub ${AWS::StackName}-healthy-nodes
      AlarmDescription: Fewer healthy nodes behind the NLB than the fleet's floor (Nodes).
      Namespace: AWS/NetworkELB
      MetricName: HealthyHostCount
      Dimensions:
        - { Name: LoadBalancer, Value: !GetAtt LoadBalancer.LoadBalancerFullName }
        - { Name: TargetGroup, Value: !GetAtt Tg8443.TargetGroupFullName }
      Statistic: Minimum
      Period: 60
      EvaluationPeriods: 3
      DatapointsToAlarm: 3
      Threshold: !Ref Nodes
      ComparisonOperator: LessThanThreshold
      TreatMissingData: breaching
  # Connections reset by the nodes or by the NLB (a node that dies or closes abruptly).
  ResetsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub ${AWS::StackName}-tcp-resets
      AlarmDescription: TCP resets from the nodes and the NLB above ResetsPerMinute.
      Metrics:
        - Id: target
          ReturnData: false
          MetricStat:
            Metric:
              Namespace: AWS/NetworkELB
              MetricName: TCP_Target_Reset_Count
              Dimensions: [{ Name: LoadBalancer, Value: !GetAtt LoadBalancer.LoadBalancerFullName }]
            Period: 60
            Stat: Sum
        - Id: elb
          ReturnData: false
          MetricStat:
            Metric:
              Namespace: AWS/NetworkELB
              MetricName: TCP_ELB_Reset_Count
              Dimensions: [{ Name: LoadBalancer, Value: !GetAtt LoadBalancer.LoadBalancerFullName }]
            Period: 60
            Stat: Sum
        - Id: resets
          Expression: FILL(target, 0) + FILL(elb, 0)
          Label: resets per minute
          ReturnData: true
      EvaluationPeriods: 5
      DatapointsToAlarm: 3
      Threshold: !Ref ResetsPerMinute
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
  TaskFailuresMetric:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref TaskEventLogs
      FilterPattern: '{ $.detail.lastStatus = "STOPPED" }'
      MetricTransformations:
        - { MetricNamespace: RollCloud, MetricName: TaskFailures, MetricValue: "1", DefaultValue: 0 }
  # Any node that crashed, failed to start or failed its health checks in the last five minutes.
  TaskFailuresAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub ${AWS::StackName}-task-failures
      AlarmDescription: A rolld task stopped on its own (crash, failed start, failed health checks).
      Namespace: RollCloud
      MetricName: TaskFailures
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 5
      DatapointsToAlarm: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
  # rolld logs one JSON object per line (ROLL_LOG_FORMAT=json; docs/cloud/README.md, "Logs"):
  # `level` is the event's level and an answered HTTP request carries its `status` as a number.
  Http5xxMetric:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref NodeLogs
      FilterPattern: "{ $.status >= 500 }"
      MetricTransformations:
        - { MetricNamespace: RollCloud, MetricName: Http5xx, MetricValue: "1", DefaultValue: 0 }
  ErrorLogsMetric:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref NodeLogs
      FilterPattern: '{ $.level = "ERROR" }'
      MetricTransformations:
        - { MetricNamespace: RollCloud, MetricName: ErrorLogs, MetricValue: "1", DefaultValue: 0 }
  ErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub ${AWS::StackName}-errors
      AlarmDescription: HTTP 5xx answers across the fleet above ErrorsPerMinute.
      Namespace: RollCloud
      MetricName: Http5xx
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 5
      DatapointsToAlarm: 3
      Threshold: !Ref ErrorsPerMinute
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching

  # ── GitHub Actions: OIDC, only main in the production environment ──
  GitHubOidc:
    Type: AWS::IAM::OIDCProvider
    Condition: CreateOidc
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList: [sts.amazonaws.com]
      ThumbprintList: [6938fd4d98bab03faadb97b34396831e3780aea1, 1c58a3a8518e8759bf075b76b750d4f2df264fcd]
  DeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${AWS::StackName}-deploy
      MaxSessionDuration: 7200
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Federated: !If [CreateOidc, !Ref GitHubOidc, !Ref GitHubOidcProviderArn] }
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                # The repository's subject claim includes the ref (deploy/cloud/README.md sets
                # it up): a job in the production environment, on main.
                token.actions.githubusercontent.com:sub: !Sub "repo:${GitHubRepo}:environment:production:ref:refs/heads/main"
      Policies:
        - PolicyName: deploy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: EcrLogin
                Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: "*"
              - Sid: EcrPush
                Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:BatchGetImage
                  - ecr:GetDownloadUrlForLayer
                  - ecr:InitiateLayerUpload
                  - ecr:UploadLayerPart
                  - ecr:CompleteLayerUpload
                  - ecr:PutImage
                  - ecr:DescribeImages
                Resource: [!GetAtt Repository.Arn, !GetAtt CacheRepository.Arn]
              - Sid: TaskDefinitions
                Effect: Allow
                Action: [ecs:RegisterTaskDefinition, ecs:DescribeTaskDefinition]
                Resource: "*"
              - Sid: Services
                Effect: Allow
                Action: [ecs:UpdateService, ecs:DescribeServices]
                Resource: [!Ref NodeService, !Ref CanaryService]
              - Sid: Tasks
                Effect: Allow
                Action: [ecs:ListTasks, ecs:DescribeTasks]
                Resource: "*"
                Condition: { ArnEquals: { ecs:cluster: !GetAtt Cluster.Arn } }
              - Sid: PassTaskRoles
                Effect: Allow
                Action: iam:PassRole
                Resource: [!GetAtt TaskRole.Arn, !GetAtt ExecutionRole.Arn]
                Condition: { StringEquals: { iam:PassedToService: ecs-tasks.amazonaws.com } }
              - Sid: Watch
                Effect: Allow
                Action: [cloudwatch:DescribeAlarms, cloudwatch:GetMetricData]
                Resource: "*"
              - Sid: Stack
                Effect: Allow
                Action: cloudformation:DescribeStacks
                Resource: !Ref AWS::StackId
              # Preflight: the secrets filled in after creation have been filled in.
              - Sid: SecretsFilled
                Effect: Allow
                Action: secretsmanager:ListSecretVersionIds
                Resource: [!Ref CloudflareToken, !Ref SystemDatabase]

Outputs:
  LoadBalancerDnsName:
    Description: The NLB; origin.<region>.<Domain> points here (CNAME), or at ElasticIps (A).
    Value: !GetAtt LoadBalancer.DNSName
  ElasticIps:
    Condition: UseEips
    Description: The NLB's addresses, one per zone.
    Value: !Join [",", [!Ref Eip1, !Ref Eip2, !Ref Eip3]]
  DataBucket:
    Value: !Ref DataBucket
  ClusterTable:
    Value: !Ref ClusterTable
  RepositoryUri:
    Value: !GetAtt Repository.RepositoryUri
  CacheRepositoryUri:
    Value: !GetAtt CacheRepository.RepositoryUri
  DeployRoleArn:
    Description: For the GitHub production environment's AWS_DEPLOY_ROLE_ARN variable.
    Value: !GetAtt DeployRole.Arn
  ClusterName:
    Value: !Ref Cluster
  NodeServiceName:
    Value: !GetAtt NodeService.Name
  CanaryServiceName:
    Value: !GetAtt CanaryService.Name
  DeployAlarms:
    Description: The alarms a canary's bake watches (and that roll a deploy back).
    Value: !Join [",", [!Ref CapacityAlarm, !Ref ResetsAlarm, !Ref TaskFailuresAlarm, !Ref ErrorsAlarm]]
  SuppliedSecrets:
    Description: Secrets to fill in after creation (deploy/cloud/README.md).
    Value: !Join [",", [!Ref CloudflareToken, !Ref SystemDatabase]]
  NodeLogGroup:
    Value: !Ref NodeLogs
