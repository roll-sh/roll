# A local copy of roll cloud (docs/cloud/README.md): three `rolld` nodes from the fleet image with
# the cloud's node settings, DynamoDB Local for membership and leases, Postgres as the system
# database, MinIO as S3, and HAProxy in front standing in for the NLB (TCP passthrough, PROXY
# protocol v2, health checks on /healthz). `scripts/test-fleet.sh` (`pnpm test:fleet`) drives it
# with crates/rolld/tests/fleet_e2e.rs; by hand:
#
#   docker build --build-arg PROFILE=dev -f deploy/cloud/Dockerfile -t roll-cloud-e2e:dev .
#   deploy/cloud/local/gen-certs.sh ~/.cache/roll-cloud-e2e/certs
#   ROLL_E2E_CERTS=~/.cache/roll-cloud-e2e/certs docker compose -f deploy/cloud/local/docker-compose.yml up -d
#   curl --cacert ~/.cache/roll-cloud-e2e/certs/ca.crt --resolve api.roll.localhost:28443:127.0.0.1 \
#     -H "Authorization: Bearer $(grep -m1 ROLL_ADMIN_TOKEN deploy/cloud/local/docker-compose.yml | cut -d: -f2 | tr -d ' ')" \
#     https://api.roll.localhost:28443/v1/info
#
# A fourth node (`--profile scale up -d node4`) is the scale-out. Every public port is published on
# 127.0.0.1 only (the ROLL_E2E_*_PORT variables move them). Hostnames are under roll.localhost and
# rollsite.localhost, which resolve to loopback on this machine (RFC 6761). The secrets below are
# placeholders for this local stack only.

name: roll-cloud-e2e

x-node: &node
  image: ${ROLL_E2E_IMAGE:-roll-cloud-e2e:dev}
  # ECS's stop timeout is 120 s: drain (ROLL_DRAIN_TIMEOUT) + the load balancer + margin.
  stop_grace_period: 60s
  depends_on:
    postgres: { condition: service_healthy }
    setup: { condition: service_completed_successfully }
  volumes:
    - ${ROLL_E2E_CERTS:?set ROLL_E2E_CERTS to the directory gen-certs.sh wrote}/edge:/certs:ro
  healthcheck:
    test: ["CMD", "/usr/local/bin/roll-health"]
    interval: 2s
    timeout: 3s
    retries: 3
    start_period: 120s
  environment: &env
    # docs/cloud/README.md, "Node settings".
    ROLL_CLUSTER_BACKEND: dynamodb
    ROLL_CLUSTER_TABLE: roll-cluster
    ROLL_CLUSTER_DYNAMODB_ENDPOINT: http://dynamodb:8000
    ROLL_CLUSTER_SECRET: roll-cloud-e2e-cluster-secret-0123456789
    ROLL_API: 0.0.0.0:7070
    ROLL_SYSTEM_DATABASE: postgres://roll:roll@postgres:5432/roll?sslmode=disable
    ROLL_PRODUCTS: redis,streams,tasks,storage,nosql,queues,code
    ROLL_S3_BUCKET: roll-cloud-e2e
    ROLL_S3_ENDPOINT: http://minio:9000
    AWS_REGION: us-east-1
    AWS_ACCESS_KEY_ID: roll
    AWS_SECRET_ACCESS_KEY: roll-cloud-e2e-minio-secret
    ROLL_SECRET_KEY: roll-cloud-e2e-secret-key-0123456789abcdef
    ROLL_ADMIN_TOKEN: roll-cloud-e2e-operator-token-0123456789
    ROLL_DASHBOARD_ORIGIN: https://roll.localhost
    ROLL_EDGE: "1"
    ROLL_EDGE_DOMAIN: roll.localhost
    ROLL_EDGE_SITE_DOMAIN: rollsite.localhost
    ROLL_EDGE_REGION: us-east-1
    ROLL_EDGE_PROXY_PROTOCOL: "1"
    ROLL_EDGE_CERT_DIR: /certs
    # The edge advertises its own Kafka port to clients, so it listens on the published one.
    ROLL_EDGE_KAFKA: 0.0.0.0:${ROLL_E2E_KAFKA_PORT:-29092}
    # The cloud waits 15 s for the NLB (checks every 5 s, 2 failures); HAProxy here checks every
    # second, so 5 s covers it.
    ROLL_EDGE_DRAIN_DELAY: "5"
    # 90 in the cloud.
    ROLL_DRAIN_TIMEOUT: "30"
    ROLL_LOG_FORMAT: json
    ROLL_QUEUES_USER: roll-admin
    ROLL_QUEUES_PASSWORD: roll-cloud-e2e-queues-password
    ROLL_CODE_PREVIEW_DOMAIN: rollsite.localhost
    RUST_LOG: ${ROLL_E2E_RUST_LOG:-info}

services:
  dynamodb:
    image: amazon/dynamodb-local:latest
    container_name: roll-cloud-e2e-dynamodb
    # -sharedDb: one database whatever credentials or region a client signs with.
    command: ["-jar", "DynamoDBLocal.jar", "-inMemory", "-sharedDb"]
    ports: ["127.0.0.1:${ROLL_E2E_DDB_PORT:-28000}:8000"]

  postgres:
    image: postgres:18-alpine
    container_name: roll-cloud-e2e-postgres
    environment:
      POSTGRES_USER: roll
      POSTGRES_PASSWORD: roll
      POSTGRES_DB: roll
    # Four nodes' pools (roll code, and every product's catalog) plus margin.
    command: ["postgres", "-c", "max_connections=500"]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "roll", "-h", "127.0.0.1"]
      interval: 1s
      retries: 60

  minio:
    image: cgr.dev/chainguard/minio:latest
    container_name: roll-cloud-e2e-minio
    command: ["server", "/data"]
    environment:
      MINIO_ROOT_USER: roll
      MINIO_ROOT_PASSWORD: roll-cloud-e2e-minio-secret

  # The bucket and the DynamoDB table, which the stack (deploy/cloud/aws/roll-cloud.yaml) creates.
  setup:
    image: amazon/aws-cli:latest
    container_name: roll-cloud-e2e-setup
    depends_on: [dynamodb, minio]
    environment:
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: roll
      AWS_SECRET_ACCESS_KEY: roll-cloud-e2e-minio-secret
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        for i in $$(seq 120); do
          aws s3api head-bucket --endpoint-url http://minio:9000 --bucket roll-cloud-e2e >/dev/null 2>&1 \
            || aws s3api create-bucket --endpoint-url http://minio:9000 --bucket roll-cloud-e2e >/dev/null 2>&1
          aws s3api head-bucket --endpoint-url http://minio:9000 --bucket roll-cloud-e2e >/dev/null 2>&1 || { sleep 1; continue; }
          aws dynamodb describe-table --endpoint-url http://dynamodb:8000 --table-name roll-cluster >/dev/null 2>&1 && exit 0
          aws dynamodb create-table --endpoint-url http://dynamodb:8000 --table-name roll-cluster \
            --billing-mode PAY_PER_REQUEST \
            --attribute-definitions AttributeName=pk,AttributeType=S AttributeName=sk,AttributeType=S \
            --key-schema AttributeName=pk,KeyType=HASH AttributeName=sk,KeyType=RANGE >/dev/null 2>&1 && exit 0
          sleep 1
        done
        echo "setup: MinIO or DynamoDB Local never answered" >&2
        exit 1

  node1:
    <<: *node
    container_name: roll-cloud-e2e-node1
    hostname: node1
    environment:
      <<: *env
      ROLL_NODE_ID: node1
      ROLL_ZONE: us-east-1a
      ROLL_ADVERTISE_URL: http://node1:7070

  node2:
    <<: *node
    container_name: roll-cloud-e2e-node2
    hostname: node2
    environment:
      <<: *env
      ROLL_NODE_ID: node2
      ROLL_ZONE: us-east-1b
      ROLL_ADVERTISE_URL: http://node2:7070

  node3:
    <<: *node
    container_name: roll-cloud-e2e-node3
    hostname: node3
    environment:
      <<: *env
      ROLL_NODE_ID: node3
      ROLL_ZONE: us-east-1c
      ROLL_ADVERTISE_URL: http://node3:7070

  # The scale-out: `docker compose --profile scale up -d node4`.
  node4:
    <<: *node
    profiles: [scale]
    container_name: roll-cloud-e2e-node4
    hostname: node4
    environment:
      <<: *env
      ROLL_NODE_ID: node4
      ROLL_ZONE: us-east-1a
      ROLL_ADVERTISE_URL: http://node4:7070

  # The NLB.
  lb:
    image: haproxy:3.2-alpine
    container_name: roll-cloud-e2e-lb
    environment:
      ROLL_E2E_KAFKA_PORT: ${ROLL_E2E_KAFKA_PORT:-29092}
    volumes: ["./haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro"]
    ports:
      - 127.0.0.1:${ROLL_E2E_HTTPS_PORT:-28443}:8443
      - 127.0.0.1:${ROLL_E2E_REDIS_PORT:-26379}:6379
      - 127.0.0.1:${ROLL_E2E_KAFKA_PORT:-29092}:${ROLL_E2E_KAFKA_PORT:-29092}
      - 127.0.0.1:${ROLL_E2E_NOSQL_PORT:-29042}:9042
      - 127.0.0.1:${ROLL_E2E_AMQPS_PORT:-25671}:5671
      - 127.0.0.1:${ROLL_E2E_LB_STATS_PORT:-28404}:8404

networks:
  default:
    name: roll-cloud-e2e-net
