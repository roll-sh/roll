# The local fleet's load balancer, standing in for the NLB (deploy/cloud/aws/roll-cloud.yaml):
# TCP passthrough on every public port, PROXY protocol v2 to the nodes, and a health check of
# `GET /healthz` on each node's internal port (7070, no PROXY header) that takes a node out after
# two failures. Like the NLB with connection termination off, a node taken out keeps the
# connections it has; new ones go to the healthy nodes. No retries on another node
# (`option redispatch` is off): the NLB doesn't do that either.
#
# The nodes are looked up through Docker's DNS, so a stopped or not yet started node (node4 before
# the scale-out) is simply out, and a restarted one is found at its new address.

global
  log stdout format raw local0 notice
  maxconn 20000

resolvers docker
  nameserver dns 127.0.0.11:53
  resolve_retries 2
  timeout resolve 1s
  timeout retry 1s
  hold valid 1s
  hold nx 1s
  hold refused 1s
  hold timeout 1s
  hold other 1s
  hold obsolete 1s

defaults
  mode tcp
  log global
  option tcplog
  option dontlognull
  timeout connect 3s
  timeout client 1h
  timeout server 1h
  timeout tunnel 1h
  timeout check 2s
  retries 1
  # The NLB checks every 5 s and takes a node out after 2 failures; faster here so a run is
  # shorter (ROLL_EDGE_DRAIN_DELAY in the compose file is scaled down the same way).
  default-server send-proxy-v2 check port 7070 inter 1s fall 2 rise 2 init-addr last,libc,none resolvers docker resolve-prefer ipv4
  option httpchk
  http-check send meth GET uri /healthz
  http-check expect status 200

listen stats
  mode http
  bind :8404
  stats enable
  stats uri /stats
  stats refresh 5s

listen https
  bind :8443
  server node1 node1:8443
  server node2 node2:8443
  server node3 node3:8443
  server node4 node4:8443

listen redis
  bind :6379
  server node1 node1:6379
  server node2 node2:6379
  server node3 node3:6379
  server node4 node4:6379

listen kafka
  # The nodes listen for Kafka on the published port (the edge advertises its own port).
  bind ":${ROLL_E2E_KAFKA_PORT}"
  server node1 "node1:${ROLL_E2E_KAFKA_PORT}"
  server node2 "node2:${ROLL_E2E_KAFKA_PORT}"
  server node3 "node3:${ROLL_E2E_KAFKA_PORT}"
  server node4 "node4:${ROLL_E2E_KAFKA_PORT}"

listen nosql
  bind :9042
  server node1 node1:9042
  server node2 node2:9042
  server node3 node3:9042
  server node4 node4:9042

listen amqps
  # The nodes listen for AMQPS on the published port (queues' connection details name it).
  bind ":${ROLL_E2E_AMQPS_PORT}"
  server node1 "node1:${ROLL_E2E_AMQPS_PORT}"
  server node2 "node2:${ROLL_E2E_AMQPS_PORT}"
  server node3 "node3:${ROLL_E2E_AMQPS_PORT}"
  server node4 "node4:${ROLL_E2E_AMQPS_PORT}"
