# roll CDN Worker: Cloudflare in front of roll storage's public read endpoints.
#
# Deploy with `pnpm --filter @roll/cdn-worker deploy` (wrangler deploy) once the zone's CDN
# hostname routes to this Worker. Secrets (never in this file):
#
#   wrangler secret put ROLL_CDN_ORIGIN_SECRET   # shared with roll: sent as X-Roll-CDN-Auth
#   wrangler secret put ROLL_CDN_JWT_SECRET      # HS256 key of signed-URL tokens (?token=)
#   wrangler secret put ROLL_CDN_JWT_ES256_JWK   # or: the ES256 public key, a JWK (JSON)
#   wrangler secret put ROLL_CDN_PRESIGN_KEY_ID  # the access key roll presigns CDN URLs with
#   wrangler secret put ROLL_CDN_PRESIGN_SECRET  # and its secret (SigV4 presigned URLs)

name = "roll-cdn"
main = "src/index.ts"
compatibility_date = "2026-07-01"

# routes = [{ pattern = "cdn.example.com/*", zone_name = "example.com" }]

[vars]
# roll's S3 endpoint (public reads and the website endpoint), as Cloudflare reaches it.
ROLL_ORIGIN = "https://s3.example.com"
# Seconds a mutable (/<bucket>/<key>) object stays at the edge when roll doesn't say; changes
# are purged by roll anyway.
ROLL_CDN_DEFAULT_TTL = "60"
# Larger objects are never stored at the edge (Cloudflare's per-object cache limit is 512 MB
# on most plans).
ROLL_CDN_MAX_CACHE_BYTES = "536870912"
# How often bytes served are reported to roll (per bucket, POST <origin>/_roll/cdn/usage).
ROLL_CDN_USAGE_FLUSH_MS = "10000"
# Origin routing by path prefix (longest wins). Keep it the same as roll's CDN `routes`
# (PATCH /v1/storage/cdn): roll purges every URL form these routes cache an object under.
# `roll storage cdn --worker` prints the values roll expects. kind: s3 (/<bucket>/<key>),
# immutable (/v/<version>/<bucket>/<key>, cached for a year), bucket-key
# (<prefix><bucket>/<key>, its non-credential query is part of the cache key), website
# (<prefix><key> of the route's `bucket`, origin = its website endpoint). auth: any, public (credentials ignored) or
# token (a signed token or presigned URL is required). origin overrides ROLL_ORIGIN;
# forward_token sends ?token= on to the origin; cache = "none" never stores.
ROLL_ROUTES = '''
[
  { "prefix": "/", "kind": "s3", "auth": "any" },
  { "prefix": "/v/", "kind": "immutable", "auth": "any" },
  { "prefix": "/storage/v1/object/public/", "kind": "bucket-key", "auth": "public", "origin": "https://storage-api.example.com" },
  { "prefix": "/storage/v1/object/sign/", "kind": "bucket-key", "auth": "token", "forward_token": true, "origin": "https://storage-api.example.com" },
  { "prefix": "/storage/v1/render/image/public/", "kind": "bucket-key", "auth": "public", "origin": "https://storage-api.example.com" },
  { "prefix": "/storage/v1/render/image/sign/", "kind": "bucket-key", "auth": "token", "forward_token": true, "origin": "https://storage-api.example.com" }
]
'''
