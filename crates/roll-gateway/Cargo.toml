[package]
name = "roll-gateway"
description = "roll secrets' gateway into private networks: the wire, the multiplexer, the allow-list and the agent (docs/secrets.md, \"Gateways\")"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
# The gateway's own loop (`roll gateway up`): a WebSocket client and the identity login.
agent = ["dep:tokio-tungstenite", "dep:reqwest", "dep:futures-util", "dep:rand", "dep:hickory-resolver"]

[dependencies]
bytes.workspace = true
ipnet.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
futures-util = { workspace = true, optional = true }
hickory-resolver = { workspace = true, optional = true }
rand = { workspace = true, optional = true }
reqwest = { workspace = true, features = ["rustls"], optional = true }
tokio-tungstenite = { workspace = true, features = ["rustls-tls-native-roots"], optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
