[package]
name = "code-chat"
description = "Chat platforms for roll's agents: Slack and Discord wire (no roll types, no I/O except their HTTP APIs)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
hex.workspace = true
hmac.workspace = true
reqwest = { workspace = true, features = ["rustls"] }
ring.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
url.workspace = true

[dev-dependencies]
axum.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
