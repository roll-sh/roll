[package]
name = "rolld"
description = "roll daemon: Postgres proxy, serverless Redis, S3-compatible storage, Kafka-compatible streams, queues broker, ScyllaDB/Cassandra-compatible nosql, control plane API and reconcilers"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
base64.workspace = true
getrandom.workspace = true
hmac.workspace = true
pbkdf2.workspace = true
sha2.workspace = true
axum.workspace = true
bytes.workspace = true
chrono.workspace = true
clap.workspace = true
roll-cluster.workspace = true
code-control.workspace = true
code-github.workspace = true
code-preview.workspace = true
futures.workspace = true
http-body.workspace = true
kafka-protocol.workspace = true
libc.workspace = true
libmimalloc-sys.workspace = true
mimalloc.workspace = true
mq-amqp.workspace = true
mq-amqp10.workspace = true
mq-cluster.workspace = true
mq-control.workspace = true
mq-core.workspace = true
mq-http.workspace = true
mq-mgmt.workspace = true
mq-mqtt.workspace = true
mq-shovel.workspace = true
mq-stomp.workspace = true
mq-storage.workspace = true
mq-stream.workspace = true
nosql-alternator.workspace = true
nosql-control.workspace = true
nosql-server.workspace = true
nosql-storage.workspace = true
object_store.workspace = true
pg-control.workspace = true
pg-proxy.workspace = true
pg-storage.workspace = true
redis-control.workspace = true
code-sql.workspace = true
redis-server.workspace = true
roll-edge.workspace = true
reqwest = { workspace = true, features = ["rustls"] }
roll-auth.workspace = true
roll-workspace.workspace = true
roll-secrets.workspace = true
http-body-util.workspace = true
tower.workspace = true
url.workspace = true
roll-access.workspace = true
roll-mcp.workspace = true
roll-previews.workspace = true
s3-api.workspace = true
s3-proto.workspace = true
s3-control.workspace = true
s3-server.workspace = true
s3-store.workspace = true
serde_json.workspace = true
stream-broker.workspace = true
tasks = { workspace = true, features = ["fleet"] }
tokio.workspace = true
tokio-rustls.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
urlencoding.workspace = true
# Only for the fleet end-to-end test (`--features fleet-e2e`), which drives Kafka with librdkafka:
# Cargo has no optional dev-dependencies, and building librdkafka for every rolld test run costs
# minutes.
rdkafka = { workspace = true, optional = true }

[features]
fleet-e2e = ["dep:rdkafka"]

[dev-dependencies]
aws-sdk-s3.workspace = true
aws-smithy-http-client.workspace = true
aws-smithy-runtime-api.workspace = true
aws-sdk-dynamodb.workspace = true
bytes.workspace = true
futures-util.workspace = true
lapin.workspace = true
rabbitmq-stream-client.workspace = true
nosql-proto = { workspace = true, features = ["client"] }
parking_lot.workspace = true
rcgen.workspace = true
reqwest.workspace = true
serde_json.workspace = true
tempfile.workspace = true
tokio.workspace = true
tower.workspace = true

# scripts/test-fleet.sh (`pnpm test:fleet`): every product through a local fleet under kills and
# rolling restarts.
[[test]]
name = "fleet_e2e"
required-features = ["fleet-e2e"]
