[package]
name = "agent-host"
description = "roll code agents: the daemon behind `roll agent up` (orchestrator, providers, worktrees, checkpoints, terminals, relay link)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
aes-gcm.workspace = true
agent-proto.workspace = true
anyhow.workspace = true
async-trait.workspace = true
axum.workspace = true
base64.workspace = true
curve25519-dalek.workspace = true
diffy.workspace = true
futures-util.workspace = true
hex.workspace = true
hkdf.workspace = true
# Project logos (`logo.rs`): rasters shrunk to a small PNG.
image = { workspace = true, features = ["ico"] }
libc.workspace = true
rand.workspace = true
# Endpoints' model lists (`endpoints.rs`); the fake orchestrator (`provider/fake.rs`) calls the
# MCP server the way an agent does.
reqwest = { workspace = true, features = ["rustls"] }
rusqlite.workspace = true
rustls-native-certs.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-rustls.workspace = true
tokio-tungstenite = { workspace = true, features = ["rustls-tls-native-roots"] }
toml.workspace = true
tracing.workspace = true
zeroize = { workspace = true, features = ["serde"] }

[dev-dependencies]
code-control.workspace = true
parking_lot.workspace = true
pg-storage.workspace = true
tempfile.workspace = true
tower.workspace = true

# Its own fake `claude` (see the file): it runs its tests from `main`.
[[test]]
name = "claude"
harness = false
