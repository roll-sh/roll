[package]
name = "search-es"
description = "Elasticsearch REST semantics for roll search: mappings, settings, Query DSL, document, search and admin APIs"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
anyhow.workspace = true
# Streaming a connector's Postgres rows (`xpack::entsearch::sync::postgres`).
futures-util.workspace = true
async-trait.workspace = true
aes-gcm.workspace = true
# Inference: SigV4 for Amazon Bedrock and SageMaker (`xpack::inference::services::aws`).
aws-credential-types.workspace = true
aws-sigv4.workspace = true
aws-smithy-runtime-api.workspace = true
base64.workspace = true
# OpenSearch Security (`xpack::security::opensearch`): internal users' bcrypt hashes, masked
# fields' BLAKE2b, password strength.
bcrypt.workspace = true
blake2.workspace = true
bytes.workspace = true
chrono.workspace = true
chrono-tz.workspace = true
# The PPL grammar bundle `_plugins/_ppl/_grammar` serves (`assets/ppl_grammar.json.gz`).
flate2.workspace = true
crc32fast.workspace = true
# Fixed-seed hashing of per-document lookups (field tables, the bulk fast path).
foldhash.workspace = true
indexmap.workspace = true
# Inference: Google service-account JWTs (RS256) for Vertex AI's OAuth tokens.
jsonwebtoken.workspace = true
itoa.workspace = true
# The `gcs` snapshot repository's service account tokens (RS256 JWTs).
libc.workspace = true
# The `s3` connector's document ids (Elastic's: the MD5 of `bucket/key`).
md-5.workspace = true
memchr.workspace = true
parking_lot.workspace = true
zeroize.workspace = true
# Password hashes of the native realm (`xpack::security`, `{PBKDF2}` format).
pbkdf2.workspace = true
rand.workspace = true
# Reindex from remote clusters (`api::remote`), behind `reindex.remote.whitelist`, and inference
# services (their hosts are HTTPS).
reqwest = { workspace = true, features = ["rustls"] }
regex.workspace = true
regex-syntax.workspace = true
# The one private-address guard for URLs tenants choose (watcher's `http` input and webhooks).
roll-net.workspace = true
ryu.workspace = true
search-aggs.workspace = true
search-analysis.workspace = true
search-codec.workspace = true
search-index.workspace = true
search-painless.workspace = true
serde_json.workspace = true
serde_yaml_ng.workspace = true
sha1.workspace = true
sha2.workspace = true
hkdf.workspace = true
# Telling "no such name" from a resolver that failed (the reindex deny names).
hickory-resolver.workspace = true
tokio.workspace = true
# The `postgresql` connector (`xpack::entsearch::sync::postgres`): TLS through rustls with ring.
tokio-postgres.workspace = true
tokio-postgres-rustls.workspace = true
tokio-rustls.workspace = true
rustls-native-certs.workspace = true
socket2.workspace = true
# Word and sentence boundaries of inference chunking (`xpack::inference::chunking`).
unicode-segmentation.workspace = true
zxcvbn.workspace = true

[build-dependencies]
serde_json.workspace = true

[dev-dependencies]
search-test-support.workspace = true
reqwest.workspace = true
# Inference tests: a throwaway service account key for Vertex AI's token flow.
rsa.workspace = true
tokio.workspace = true
