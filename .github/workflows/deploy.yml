name: deploy

# roll cloud: every merge to main ships one arm64 image to the fleet through a canary
# (deploy/cloud/README.md). The steps are deploy/cloud/deploy.sh, which also runs by hand.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: An image tag already in ECR to deploy (a commit SHA). Empty builds this commit.
        required: false
        default: ""
      diagnose:
        description: Only read why deploys fail (deploy.sh diagnose); deploys nothing.
        type: boolean
        default: false
      hours:
        description: How far back diagnose reads (1 to 360).
        required: false
        default: "24"

permissions:
  contents: read
  id-token: write
  # A failed deploy opens (or comments on) an issue; the next green one closes it (report.sh).
  issues: write

jobs:
  deploy:
    # Skipped until the stack exists and the repository variable names its deploy role.
    if: vars.AWS_DEPLOY_ROLE_ARN != '' && !inputs.diagnose
    runs-on: ubuntu-24.04-arm
    environment: production
    timeout-minutes: 240
    # One deploy at a time; a newer merge waits, and only the newest waiting one runs.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      AWS_REGION: us-east-1
      ROLL_CLOUD_STACK: roll-cloud
      TAG: ${{ inputs.tag || github.sha }}
    steps:
      - uses: actions/checkout@v5
      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1
          role-duration-seconds: 7200
      - name: AWS CLI
        run: |
          if ! command -v aws >/dev/null; then
            curl -fsSL https://awscli.amazonaws.com/awscli-exe-linux-aarch64.zip -o "$RUNNER_TEMP/awscli.zip"
            unzip -q "$RUNNER_TEMP/awscli.zip" -d "$RUNNER_TEMP"
            sudo "$RUNNER_TEMP/aws/install"
          fi
          aws --version
      - uses: docker/setup-buildx-action@v3
      # Each step's output also goes to deploy.log, for the issue a failure opens.
      - name: Build and push
        if: inputs.tag == ''
        shell: bash
        run: deploy/cloud/deploy.sh push "$TAG" 2>&1 | tee -a "$RUNNER_TEMP/deploy.log"
      - name: Canary, bake, roll
        shell: bash
        run: deploy/cloud/deploy.sh deploy "$TAG" 2>&1 | tee -a "$RUNNER_TEMP/deploy.log"
      # deploy.sh rolls back on its own failures; this covers a cancelled job (or a runner that
      # died mid-rollback). It's a no-op when the fleet already runs the previous revision.
      - name: Roll back
        if: failure() || cancelled()
        run: |
          if [ -s "$RUNNER_TEMP/roll-cloud-deploy-$ROLL_CLOUD_STACK" ]; then
            deploy/cloud/deploy.sh rollback
          else
            echo "nothing was deployed"
          fi
      # Loud: a failure stays visible as an open issue until a deploy goes out.
      - name: Report the failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: deploy/cloud/report.sh failed "$RUNNER_TEMP/deploy.log"
      - name: Close the failure issue
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: deploy/cloud/report.sh deployed

  # Read only, beside a running deploy: alarms, the minutes their metrics breached, the services'
  # events and the stopped nodes' reasons.
  diagnose:
    if: vars.AWS_DEPLOY_ROLE_ARN != '' && inputs.diagnose
    runs-on: ubuntu-24.04-arm
    environment: production
    timeout-minutes: 30
    env:
      AWS_REGION: us-east-1
      ROLL_CLOUD_STACK: roll-cloud
      HOURS: ${{ inputs.hours }}
    steps:
      - uses: actions/checkout@v5
      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1
      - name: Diagnose
        run: deploy/cloud/deploy.sh diagnose "$HOURS"
