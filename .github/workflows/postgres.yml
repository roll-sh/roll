name: postgres

# Extended validation, run manually when needed.
on:
  workflow_dispatch:
  # Extended suites run on demand; ci.yml is the two-minute merge gate.
  workflow_call:

concurrency:
  group: postgres-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only
  CARGO_INCREMENTAL: '0'
  # Images pinned by digest (tag@multi-arch index digest), the same refs the scripts and tests use.
  SEAWEEDFS_IMAGE: chrislusf/seaweedfs:4.50@sha256:c2658820e763294a9e9de7b36c81e59b879e3459148351aee4e31a126ca64860

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - run: scripts/test-postgres.sh --force --unit

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Computes reach the control plane through the Docker host gateway.
      ROLL_E2E_BIND: 0.0.0.0
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Pull Postgres images
        run: for v in 16 17 18; do docker pull -q postgres:$v-alpine & done; wait
      - name: Local object store
        run: scripts/test-postgres.sh --force

      - name: S3 object store (SeaweedFS)
        env:
          AWS_ACCESS_KEY_ID: roll
          AWS_SECRET_ACCESS_KEY: roll
          AWS_REGION: us-east-1
          ROLL_E2E_S3_BUCKET: roll-e2e
          ROLL_E2E_S3_ENDPOINT: http://127.0.0.1:8333
        run: |
          docker run -d --name seaweed -p 8333:8333 "$SEAWEEDFS_IMAGE" server -s3
          for _ in $(seq 60); do curl -s -o /dev/null http://127.0.0.1:8333 && break; sleep 1; done
          docker exec seaweed sh -c 'echo "s3.bucket.create -name roll-e2e" | weed shell'
          ROLL_E2E=1 cargo test -p pg-control --test e2e -- --test-threads=4 \
            point_in_time restore_in_place eviction survives read_replicas retention
