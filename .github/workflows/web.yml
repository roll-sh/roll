name: web

# Runs only when the dashboard or shared packages change.
on:
  push:
    branches: [main]
    paths:
      - "apps/**"
      - "packages/**"
      - "crates/s3-*/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/web.yml"
  workflow_dispatch:
  # Pull requests and the merge queue run this through ci.yml.
  workflow_call:

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm --filter dashboard test
      # @roll/storage's tests run storage-js against the real developer API.
      - run: cargo build -p s3-api --example storage-api
      - run: pnpm --filter @roll/storage test
      - run: pnpm build
