name: web

# Extended validation, run manually when needed.
on:
  workflow_dispatch:
  # Extended suites run on demand; ci.yml is the two-minute merge gate.
  workflow_call:

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only
  CARGO_INCREMENTAL: '0'

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm --filter dashboard test
      # @roll/storage's tests run storage-js against the real developer API.
      - run: cargo build -p s3-api --example storage-api
      - run: pnpm --filter @roll/storage test
      # @roll/secrets: the sealed box against a box rolld sealed, and the watch loop.
      - run: pnpm --filter @roll/secrets test
      - run: pnpm build
