name: redis

# Extended validation, run manually when needed.
on:
  workflow_dispatch:
  # Extended suites run on demand; ci.yml is the two-minute merge gate.
  workflow_call:

concurrency:
  group: redis-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only
  CARGO_INCREMENTAL: '0'
  # Images pinned by digest (tag@multi-arch index digest), the same refs the scripts and tests use.
  ROLL_COMPAT_IMAGE: redis:8.10.3-alpine@sha256:71885d8cc6e42f2bc0aa2eb853bfc4be200b5108a46ac50e117ae1df0531fb80
  DYNAMODB_IMAGE: amazon/dynamodb-local:3.3.2@sha256:6ada631ec7aa5fc83446855eb17233e3dad184fec47477e8140c6c569cfe0c86
  SEAWEEDFS_IMAGE: chrislusf/seaweedfs:4.50@sha256:c2658820e763294a9e9de7b36c81e59b879e3459148351aee4e31a126ca64860

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      # The cluster tests' DynamoDB backend (the script starts it).
      - run: docker pull -q "$DYNAMODB_IMAGE"
      - run: scripts/test-redis.sh --force --unit

  compat:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - run: docker pull -q "$ROLL_COMPAT_IMAGE"
      - name: Differential compatibility with Redis 8
        run: ROLL_COMPAT_REQUIRED=1 cargo test -p redis-server --test compat

  s3:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AWS_ACCESS_KEY_ID: roll
      AWS_SECRET_ACCESS_KEY: roll
      AWS_REGION: us-east-1
      ROLL_E2E_S3_BUCKET: roll-e2e
      ROLL_E2E_S3_ENDPOINT: http://127.0.0.1:8333
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: S3 object store (SeaweedFS)
        run: |
          docker run -d --name seaweed -p 8333:8333 "$SEAWEEDFS_IMAGE" server -s3
          for _ in $(seq 60); do curl -s -o /dev/null http://127.0.0.1:8333 && break; sleep 1; done
          docker exec seaweed sh -c 'echo "s3.bucket.create -name roll-e2e" | weed shell'
      - name: Durability, replicas and the control plane on S3
        run: |
          cargo test -p redis-server --test persist --test repl --test node
          cargo test -p redis-control --tests
