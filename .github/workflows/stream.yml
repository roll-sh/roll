name: stream

# Extended validation, run manually when needed.
on:
  workflow_dispatch:
  # Extended suites run on demand; ci.yml is the two-minute merge gate.
  workflow_call:

concurrency:
  group: stream-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only
  CARGO_INCREMENTAL: '0'

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      # librdkafka is built from source for the client tests; it includes the curl headers on Linux.
      - run: sudo apt-get update && sudo apt-get install -y cmake libcurl4-openssl-dev libsasl2-dev
      - run: scripts/test-stream.sh --force --unit

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Kafka tool containers reach the broker through the Docker host gateway.
      ROLL_E2E_BIND: 0.0.0.0
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - run: sudo apt-get update && sudo apt-get install -y cmake libcurl4-openssl-dev libsasl2-dev
      - name: Pull the Kafka image
        run: docker pull -q apache/kafka:4.1.0
      - name: Java clients and tools
        run: scripts/test-stream.sh --force

      - name: Object storage on S3 (SeaweedFS)
        env:
          AWS_ACCESS_KEY_ID: roll
          AWS_SECRET_ACCESS_KEY: roll
          AWS_REGION: us-east-1
          ROLL_E2E_S3_BUCKET: roll-e2e
          ROLL_E2E_S3_ENDPOINT: http://127.0.0.1:8333
        run: |
          docker run -d --name seaweed -p 8333:8333 chrislusf/seaweedfs server -s3
          for i in $(seq 60); do curl -s -o /dev/null http://127.0.0.1:8333 && break; sleep 1; done
          docker exec seaweed sh -c 'echo "s3.bucket.create -name roll-e2e" | weed shell'
          cargo test -p stream-broker --test storage --test compaction --test rdkafka --test http
