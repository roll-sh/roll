name: ci

# The merge gate is a bounded smoke check that finishes in under a minute. Docker, compatibility
# and stress suites remain available through the individual workflows' manual triggers.
on:
  pull_request:
  merge_group:
  push:
    branches: [main]
  # Daily on main: keeps main's Rust cache alive (GitHub drops caches unused for 7 days), so
  # pull requests start warm.
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The Rust smoke tests, one job per dependency tree so the slowest cold build stays under a
  # minute. Only main saves the cache; pull requests restore it.
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    strategy:
      matrix:
        include:
          # Git framing and packs.
          - name: git
            packages: -p code-git
          # Reviewer schemas, pricing and key sealing.
          - name: review
            packages: -p code-review
          # RESP and S3 auth and parsing.
          - name: protocols
            packages: -p redis-proto -p s3-proto
          # Secrets: values bound to their row, references, .env, token scopes.
          - name: secrets
            packages: -p roll-secrets
          # roll search's segment format (doc values, points, postings, live docs); the rest of
          # search runs in `pnpm test:search` and the on-demand `search` workflow.
          - name: search
            packages: -p search-codec
          # The permission model scoped tokens are decided by (rules, covers, outcomes).
          - name: access
            packages: -p roll-auth
    name: rust (${{ matrix.name }})
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo test --locked ${{ matrix.packages }} --lib

  # Every package's types (TypeScript 7, scripts/typecheck.mjs), the dashboard's node tests and the
  # desktop app's tests.
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-web
      - run: pnpm typecheck
      - run: pnpm --filter dashboard test:node
      - run: pnpm --filter @roll/desktop test

  # The dashboard's vitest suite, split across runners.
  dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    strategy:
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-web
        with:
          filter: dashboard...
      - run: pnpm --filter dashboard exec vitest run --shard=${{ matrix.shard }}/3

  # roll secrets' Go and Python clients (sdk/): the same surface as @roll/secrets.
  sdk:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: false
      - name: Go
        working-directory: sdk/go/secrets
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
          go test -race -count=1 ./...
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python
        working-directory: sdk/python/roll_secrets
        run: |
          pip install -q cryptography
          PYTHONPATH=src python -m unittest discover -s tests

  # The roll Terraform provider (sdk/terraform-provider-roll): Terraform drives it against a fake
  # rolld in memory.
  terraform:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    defaults:
      run:
        working-directory: sdk/terraform-provider-roll
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version-file: sdk/terraform-provider-roll/go.mod
          cache-dependency-path: sdk/terraform-provider-roll/go.sum
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: TF_ACC=1 go test -count=1 ./...

  scripts:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v5
      - name: The roll secrets GitHub Action (sdk/github-action)
        run: node --test sdk/github-action/test.js
      - name: Validate test scripts
        run: |
          for script in scripts/test-*.sh scripts/lib/*.sh scripts/nosql-conformance.sh; do
            bash -n "$script"
          done
      - name: Validate workflows
        run: |
          version=1.7.12
          if curl -fsSL --max-time 20 --retry 1 --retry-all-errors -o actionlint.tar.gz "https://github.com/rhysd/actionlint/releases/download/v$version/actionlint_${version}_linux_amd64.tar.gz"; then
            tar -xzf actionlint.tar.gz actionlint
            ./actionlint -shellcheck=
          else
            docker run --rm -v "$PWD:/repo" -w /repo "rhysd/actionlint:$version@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667" -shellcheck=
          fi

  ci:
    needs: [rust, web, dashboard, sdk, scripts, terraform]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$NEEDS" | jq -e 'all(.[]; .result == "success")' > /dev/null
