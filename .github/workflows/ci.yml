name: ci

# The merge gate is a bounded smoke check that finishes in under a minute. Docker, compatibility
# and stress suites remain available through the individual workflows' manual triggers.
on:
  pull_request:
  merge_group:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      # Git framing/packs, reviewer schemas/pricing/key sealing, RESP and S3 auth/parsing.
      - run: cargo test --locked -p code-git -p code-review -p redis-proto -p s3-proto --lib

  # Every package's types (TypeScript 7, scripts/typecheck.mjs), the dashboard's node tests and the
  # desktop app's tests.
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-web
      - run: pnpm typecheck
      - run: pnpm --filter dashboard test:node
      - run: pnpm --filter @roll/desktop test

  # The dashboard's vitest suite, split across runners.
  dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    strategy:
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-web
        with:
          filter: dashboard...
      - run: pnpm --filter dashboard exec vitest run --shard=${{ matrix.shard }}/3

  scripts:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v5
      - name: Validate test scripts
        run: |
          for script in scripts/test-*.sh scripts/lib/*.sh scripts/nosql-conformance.sh; do
            bash -n "$script"
          done
      - name: Validate workflows
        run: |
          version=1.7.7
          if curl -fsSL --max-time 20 --retry 1 --retry-all-errors -o actionlint.tar.gz "https://github.com/rhysd/actionlint/releases/download/v$version/actionlint_${version}_linux_amd64.tar.gz"; then
            tar -xzf actionlint.tar.gz actionlint
            ./actionlint -shellcheck=
          else
            docker run --rm -v "$PWD:/repo" -w /repo "rhysd/actionlint:$version" -shellcheck=
          fi

  ci:
    needs: [rust, web, dashboard, scripts]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$NEEDS" | jq -e 'all(.[]; .result == "success")' > /dev/null
